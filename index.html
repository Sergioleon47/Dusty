/* El gasto del mes se arma solo con el monto real de cada recibo escaneado (no
   la suma de los productos que el OCR logró emparejar, que puede quedar corta
   si algo no se leyó bien). Por ahora el gasto se basa 100% en recibos. */
function spendForMonth(key){
  return receipts.filter(r=>monthKey(r.date)===key).reduce((s,r)=>s+(r.total||0),0);
}

/* ================= RENDER ================= */
/* render() reconstruye TODO el HTML de #app de una — no hace diffing. Si un dedo está
   en medio de un deslice entre pestañas (swipeGestureActive), reconstruir ahora
   reemplazaría el nodo .view-track que el gesto está animando a mano, y el propio
   código de attachViewSwipeHandlers lo detecta como "la pantalla cambió por debajo"
   y aborta el gesto en seco — se siente como que el deslice "no agarra" o se corta
   solo. Puede pasar por cualquier cosa que dispare un render en el momento menos
   pensado: un snapshot de Firestore llegando, el latido de presencia del modo equipo
   cada 30s, etc. En vez de perder esa actualización, se pospone y se aplica de una
   sola vez apenas el dedo suelta (ver flushPendingRenderIfAny, llamado desde
   endGestureImpl en attachViewSwipeHandlers). */
let swipeGestureActive = false;
let renderPendingAfterGesture = false;
function render(){
  // trackAnimating cubre el resorte de asentado (tap en la barra de abajo, o el
  // "suelto el dedo y termina de acomodarse" de un swipe) — swipeGestureActive por
  // sí solo no alcanza ahí porque ya se puso en false apenas se soltó el dedo (ver
  // endGestureImpl) o nunca llegó a ponerse en true (tocar un botón no es un
  // arrastre). Sin este chequeo, un render disparado desde afuera (un snapshot de
  // Firestore, el latido de presencia) durante esa ventana reemplaza el nodo
  // .view-track que el resorte todavía está animando a mano: el rAF en curso queda
  // animando un nodo huérfano (fuera del DOM, invisible) hasta que se asienta solo
  // y dispara un segundo redibujado tardío — se siente como un freeze seguido de un
  // salto brusco.
  // Mismo motivo que arriba, pero para la cámara del escaneo de código de barras:
  // mientras barcodeScannerInstance existe hay un <video> de verdad adentro de
  // #barcode-reader que la librería de códigos de barras maneja a mano — un
  // redibujado completo (un snapshot de Firestore llegando en el peor momento, por
  // ejemplo) le arrancaría el <video> por debajo sin avisarle, dejando la cámara
  // prendida sin feed visible y sin forma de apagarla. Importante: el chequeo es
  // sobre barcodeScannerInstance (¿la cámara ya está prendida de verdad?), NO sobre
  // barcodeScanState==='scanning' — ese estado se pone ANTES del primer render que
  // recién va a CREAR el <div id="barcode-reader">, así que frenar ese primer
  // render por el estado dejaría el modal sin aparecer nunca.
  if(swipeGestureActive || trackAnimating || barcodeScannerInstance){ renderPendingAfterGesture = true; return; }
  try{
    renderApp();
  }catch(err){
    console.error('Dusty render error:', err);
    reportClientError(err, 'render');
    renderCrashScreen(err);
  }
}
function flushPendingRenderIfAny(){
  if(renderPendingAfterGesture){ renderPendingAfterGesture = false; render(); }
}

/* Los 4 listeners de Firestore (inventario/compras/recibos/meta) llegan cada uno por
   su lado — en una red real casi nunca al mismo tiempo. Sin esto, reconectar a la
   nube redibuja la pantalla entera hasta 4 veces seguidas en menos de un segundo
   (cada redibujado vuelve a decodificar todas las fotos incrustadas), y se ve como
   que la información "parpadea" o desaparece y vuelve. Junta varias llegadas
   cercanas en el tiempo en un solo redibujado al final. Solo la usan esos 4
   handlers — las acciones directas del usuario (tocar un botón, etc.) siguen
   llamando a render() de una, sin esperar nada, para que se sientan instantáneas. */
let cloudRenderDebounceTimer = null;
function scheduleCloudTriggeredRender(){
  if(cloudRenderDebounceTimer) clearTimeout(cloudRenderDebounceTimer);
  cloudRenderDebounceTimer = setTimeout(()=>{ cloudRenderDebounceTimer = null; render(); }, 80);
}

/* Mismo problema que scheduleCloudTriggeredRender de arriba, pero disparado por el
   usuario en vez de la nube: los buscadores de recibos (por texto y por monto) llaman
   a esto en cada tecla, y como render() reconstruye #app entero, cada letra volvía a
   decodificar de cero todas las fotos de recibo visibles (la grilla de recibos, las
   miniaturas del calendario) — eso es lo que se sentía como que las fotos
   "parpadean"/desaparecen mientras se escribe. Juntar las teclas seguidas en un solo
   redibujado al final (como ya hacen los eventos de Firestore) evita ese redibujado
   de más sin perder la sensación de "busca mientras escribís". */
let searchRenderDebounceTimer = null;
function scheduleSearchTriggeredRender(afterRender){
  clearTimeout(searchRenderDebounceTimer);
  searchRenderDebounceTimer = setTimeout(()=>{ searchRenderDebounceTimer = null; render(); afterRender(); }, 150);
}

// El alto de .view-viewport se fija al de la página activa nada más (ver nota en el
// CSS de .view-viewport) — se llama después de cada render() y también al terminar
// la animación de switchToTab(), porque ahí el DOM no se vuelve a dibujar de cero
// pero la página visible sí puede haber cambiado de alto.
function syncViewportHeight(){
  const viewport = document.querySelector('.view-viewport');
  const pages = document.querySelectorAll('.view-page');
  const idx = TAB_ORDER.indexOf(activeTab);
  if(!viewport || !pages[idx]) return;
  const contentHeight = pages[idx].getBoundingClientRect().height;
  // Si el contenido de la pestaña activa es corto (ej. Inventario filtrado al conteo
  // cíclico, con un solo producto) y no llega a tapar la pantalla hasta la barra de
  // abajo, se estira igual hasta ahí — si no, queda un hueco vacío mostrando el
  // degradé verde decorativo del header (pensado para asomar solo arriba, detrás del
  // topbar/dashboard) en medio de la pantalla, encima de la barra de navegación.
  const bottomNavEl = document.querySelector('.bottom-nav');
  const navHeight = bottomNavEl ? bottomNavEl.getBoundingClientRect().height : 0;
  const fillHeight = Math.max(0, window.innerHeight - viewport.getBoundingClientRect().top - navHeight);
  const totalHeight = Math.max(contentHeight, fillHeight);
  viewport.style.height = totalHeight + 'px';
  // El fondo gris solo arranca EXACTO donde termina el contenido real (contentHeight)
  // — arriba de esa línea queda transparente, tal como estaba siempre, para no tapar
  // el degradé verde de marca del <body> que se sigue viendo (a propósito) en los
  // huecos entre tarjetas cerca del header. Pintar TODO .view-viewport de gris de
  // punta a punta (como se probó antes) tapaba también esa parte de arriba y dejaba
  // un corte feo justo donde arranca el contenido — acá el corte cae exactamente
  // donde el contenido real ya terminó, así no se nota.
  viewport.style.background = totalHeight>contentHeight
    ? `linear-gradient(to bottom, transparent ${contentHeight}px, var(--bg) ${contentHeight}px)`
    : 'none';
}

/* Categoría de ícono por ingrediente, heurística por palabras clave en el nombre.
   Placeholder de apariencia — cuando definamos el contenido real se puede
   reemplazar por un selector manual o por categoría. */
function stockIconKey(name){
  const n = (name||'').toLowerCase();
  if(/beef|res\b|steak|carne de res|ground beef|molida/.test(n)) return 'beef';
  if(/pork|cerdo|bacon|tocino|jamon|jamón|\bham\b/.test(n)) return 'pork';
  if(/sausage|salchicha|chorizo/.test(n)) return 'sausage';
  if(/chicken|pollo/.test(n)) return 'chicken';
  if(/shrimp|camar/.test(n)) return 'shrimp';
  if(/fish|pescado|seafood|marisco|salmon|tilapia|atun|tuna/.test(n)) return 'fish';
  if(/\beggs?\b|huevo/.test(n)) return 'egg';
  if(/cheese|queso/.test(n)) return 'cheese';
  if(/milk|leche|cream|crema|butter|mantequilla|yogurt|yogur/.test(n)) return 'dairy';
  if(/tomato|tomate/.test(n)) return 'tomato';
  if(/onion|cebolla/.test(n)) return 'onion';
  if(/garlic|\bajo\b/.test(n)) return 'garlic';
  if(/lettuce|lechuga|spinach|espinaca|kale|arugula|r[úu]cula|greens/.test(n)) return 'lettuce';
  if(/pimienta|black pepper|paprika|comino|cumin|or[ée]gano|canela|cinnamon|clove|chili powder|especia|spice/.test(n)) return 'spice';
  if(/chili|chile|jalape|poblano|serrano|habanero|cayenne/.test(n)) return 'chili';
  if(/pepper|pimiento|piment[oó]n|bell pepper/.test(n)) return 'pepper';
  if(/potato|papas?\b|patata/.test(n)) return 'potato';
  if(/carrot|zanahoria/.test(n)) return 'carrot';
  if(/cucumber|pepino/.test(n)) return 'cucumber';
  if(/avocado|aguacate|palta/.test(n)) return 'avocado';
  if(/lime|lemon|limas?\b|lim[oó]n/.test(n)) return 'lime';
  if(/\bcorn\b|ma[ií]z|elote/.test(n)) return 'corn';
  if(/mushroom|hongo|champi/.test(n)) return 'mushroom';
  if(/tortilla/.test(n)) return 'tortilla';
  if(/bread|brioche|bun\b|\bpan de\b|panecillo/.test(n)) return 'bread';
  if(/\brice\b|arroz/.test(n)) return 'rice';
  if(/pasta|spaghetti|fideo|noodle/.test(n)) return 'pasta';
  if(/flour|harina/.test(n)) return 'flour';
  if(/sugar|az[uú]car/.test(n)) return 'sugar';
  if(/\bsalt\b|\bsal\b/.test(n)) return 'salt';
  if(/ketchup|catsup/.test(n)) return 'ketchup';
  if(/mustard|mostaza/.test(n)) return 'mustard';
  if(/mayo|mayonnaise|mayonesa/.test(n)) return 'mayo';
  if(/vinegar|vinagre/.test(n)) return 'vinegar';
  if(/\boil\b|aceite/.test(n)) return 'oil';
  if(/soda|soft drink|refresco|gaseosa|\bcola\b|sprite|pepsi/.test(n)) return 'soda';
  if(/juice|jugo|zumo/.test(n)) return 'juice';
  if(/coffee|caf[eé]/.test(n)) return 'coffee';
  if(/\bbeer\b|cerveza/.test(n)) return 'beer';
  if(/\bwine\b|\bvino\b/.test(n)) return 'wine';
  if(/\bwater\b|\baguas?\b/.test(n)) return 'water';
  if(/napkin|servilleta|paper towel|toalla de papel/.test(n)) return 'napkin';
  if(/\bcups?\b|\bvasos?\b|container|envase|to-go|takeout/.test(n)) return 'cup';
  if(/\bice\b|hielo/.test(n)) return 'ice';
  if(/soap|jab[oó]n|detergent|detergente|cleaner|limpiador/.test(n)) return 'soap';
  return 'box';
}

/* Un brillo suave arriba-a-la-izquierda le da a cualquier ícono plano una sensación
   de profundidad/pulido (como un ícono de app premium) sin tener que rehacer a mano
   cada una de las 46 ilustraciones — se agrega una sola vez acá, encima de lo que sea. */
function stockIconFallbackSvg(key){
  return `<svg viewBox="0 0 48 48">${STOCK_ICONS[key] || STOCK_ICONS.box}<ellipse cx="17" cy="13" rx="10" ry="6.5" fill="#fff" opacity="0.22"/></svg>`;
}
function stockIconSvg(item){
  // Acepta tanto un ingrediente completo (para poder usar su foto propia si tiene)
  // como, por compatibilidad, un string suelto con el nombre.
  const name = typeof item==='string' ? item : (item && item.name) || '';
  const key = stockIconKey(name);
  // 1. Prioridad máxima: foto que el usuario subió a mano para este producto
  //    específico — pensado para productos que no son comida (electrodomésticos,
  //    ferretería, etc.), donde ningún ícono automático tiene sentido.
  const ownPhoto = item && typeof item==='object' ? itemPhotoSrc(item) : null;
  if(ownPhoto){
    // escapeHtml en el src: la foto (url/mediaType) puede venir de un compañero de equipo
    // vía Firestore; sin escapar, un " en esos campos rompe el atributo e inyecta onerror.
    // key siempre sale de la whitelist de stockIconKey (constante), así que ahí no hay riesgo.
    return `<img src="${escapeHtml(ownPhoto)}" alt="" loading="lazy" onerror="this.outerHTML=stockIconFallbackSvg('${key}')">`;
  }
  const photo = PRODUCT_PHOTOS[key];
  if(photo){
    // Si la foto no carga (sin internet, o la URL de Wikimedia cambió), cae al ícono
    // dibujado en vez de dejar el círculo vacío.
    return `<img src="${photo}" alt="" loading="lazy" onerror="this.outerHTML=stockIconFallbackSvg('${key}')">`;
  }
  return stockIconFallbackSvg(key);
}
function stockStatus(pct){ return pct>=60 ? 'ok' : pct>=20 ? 'warn' : 'crit'; }
// A diferencia de stockStatus (pct alto = bien, queda stock), acá pct alto = mal
// (ya gastaste esa parte del presupuesto) — la escala va al revés a propósito.
function budgetStatus(pct){ return pct>=100 ? 'crit' : pct>=80 ? 'warn' : 'ok'; }

/* stockTarget es un placeholder mientras definimos de dónde sale el "stock objetivo"
   real (ver conversación pendiente) — por ahora se estima a partir de lo que hay.
   Un ingrediente que nunca tuvo una compra registrada y sigue en 0 no es "crítico"
   de verdad — todavía no hay datos para juzgarlo, así que se marca aparte ('none')
   en vez de asustar a un usuario nuevo con todo el inventario en rojo desde el día 1. */
function stockRowsData(){
  return inventory.map(i=>{
    const hasHistory = (i.qtyOnHand||0)>0 || purchases.some(p=>p.ingId===i.id);
    const target = i.stockTarget || Math.max(Math.round((i.qtyOnHand||0)*1.5), 10);
    const pct = target>0 ? Math.min(100, Math.round(((i.qtyOnHand||0)/target)*100)) : 0;
    return {ing:i, target, pct, status: hasHistory ? stockStatus(pct) : 'none'};
  });
}

/* Esta tarjeta vive en el Dashboard. Sus filas usan .stock-row-static, igual que las
   de Inventario — ninguna de las dos tiene gesto de deslizar propio, porque esta
   pantalla es donde MÁS se usa el gesto de deslizar para cambiar de pestaña
   (attachViewSwipeHandlers) y la tarjeta ocupa casi toda la pantalla: con un gesto de
   arrastre por fila activo ahí, el dedo casi siempre caía sobre una fila y competía
   con el cambio de pestaña. Borrar un producto se hace con la x chica de cada fila
   (deleteStockItem), disponible tanto acá como en Inventario. */
/* Anillo (donut) de salud del inventario: de un vistazo, qué porción está OK vs.
   necesita atención — sin tener que leer fila por fila. Solo cuenta productos con
   datos suficientes para juzgarlos (status !=='none', ver stockRowsData) — un
   inventario recién cargado, todavía sin compras registradas, no se ve "crítico"
   por falta de datos. R=15.915 y circunferencia≈100 es el truco clásico de donut en
   SVG (viewBox 0 0 36 36): cada segmento mide su propio % directo en unidades de
   dasharray, sin tener que convertir a grados. */
function stockHealthRing(rows){
  const graded = rows.filter(r=>r.status!=='none');
  const total = graded.length;
  if(total===0) return '';
  const counts = {ok:0, warn:0, crit:0};
  graded.forEach(r=>counts[r.status]++);
  const R = 15.915, CIRC = 2*Math.PI*R;
  let offset = 0;
  const segments = [
    {n:counts.crit, color:'var(--stock-crit)'},
    {n:counts.warn, color:'var(--stock-warn)'},
    {n:counts.ok, color:'var(--stock-ok)'},
  ].filter(s=>s.n>0).map(s=>{
    const len = (s.n/total)*CIRC;
    const circle = `<circle cx="18" cy="18" r="${R}" fill="none" stroke="${s.color}" stroke-width="4" stroke-dasharray="${len.toFixed(2)} ${(CIRC-len).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}"/>`;
    offset += len;
    return circle;
  }).join('');
  const okPct = Math.round((counts.ok/total)*100);
  const ringTitle = uiLang==='en' ? `${okPct}% of your inventory is at a healthy stock level` : `${okPct}% de tu inventario está en un nivel de stock saludable`;
  return `
  <div style="position:relative;width:46px;height:46px;flex-shrink:0;" title="${ringTitle}">
    <svg viewBox="0 0 36 36" style="width:100%;height:100%;transform:rotate(-90deg);">
      <circle cx="18" cy="18" r="${R}" fill="none" stroke="var(--bg)" stroke-width="4"/>
      ${segments}
    </svg>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'Space Grotesk';color:var(--ink);">${okPct}%</div>
  </div>`;
}

/* ---------- INVENTARIO ---------- */
// Mientras hay un conteo cíclico pendiente, Inventario muestra SOLO esos productos
// en vez de la lista completa — a propósito, para que sea imposible perderse cuál
// tocaba contar entre el resto. showFullInventoryDespiteCycleCount es la única
// salida: un link chico para ver el resto del inventario igual (agregar un
// producto nuevo, editar precio de algo que no le toca contar hoy, etc.) sin tener
// que esperar a terminar el conteo. Se resetea solo al recargar la página — es una
// preferencia de la sesión, no algo que haya que guardar.
let showFullInventoryDespiteCycleCount = false;
// Filtro de categoría activado desde los botones del Dashboard — al tocar una
// categoría se guarda su id acá y se cambia a la pestaña Inventario, que lo lee y
// muestra solo esos productos (ver inventarioView). También es preferencia de
// sesión nomás, se resetea solo al recargar.
let inventoryCategoryFilter = null;
/* Agrupa las filas de inventario por categoría, en el orden en que el usuario las
   tiene definidas — los productos sin categoría (o con una categoría que ya no
   existe, ej. se borró) van todos juntos al final en "Sin categoría". Solo se
   arman grupos con al menos una fila, para no mostrar encabezados vacíos. */
function groupRowsByCategory(rows){
  const groups = categories.map(c=>({id:c.id, name:c.name, rows:[]}));
  const groupById = {};
  groups.forEach(g=>{ groupById[g.id]=g; });
  const uncategorized = {id:null, name:t('categories_uncategorized'), rows:[]};
  rows.forEach(r=>{
    const cid = r.ing.categoryId;
    const g = (cid && groupById[cid]) ? groupById[cid] : uncategorized;
    g.rows.push(r);
  });
  return groups.concat([uncategorized]).filter(g=>g.rows.length>0);
}
function stockRowHtml(r, ccDueIds){

        <div class="stock-caption">${escapeHtml(i.qtyOnHand||0)} ${escapeHtml(unitLabel(i.unit))} ${t('inv_in_stock_suffix')}</div>
      </div>

          <button class="stock-icon-btn edit" data-edit-item="${i.id}" title="${t('btn_edit')}">
            <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>

}

  const allRows = stockRowsData();

    groups.length>1
      ? groups.map(g=>`

/* ---------- RECIBOS (historial) ---------- */
// Recuerda qué mes estabas mirando en el calendario de recibos — sin esto, navegar a un
// mes viejo y refrescar la página te devolvía al mes actual, como si te hubieras "perdido".
function setCalendarMonth(m){
  calendarViewMonth = m;
  try{ localStorage.setItem('patron_cal_month', m); }catch(e){}
}
/* Busca por monto ("120" encuentra $120.00) o por nombre de producto comprado
   ("camarón" encuentra un recibo que tenía "Camarones grande"), y marca para
   parpadear en el calendario los días de los recibos que coincidan. Se guarda en
   localStorage para que sobreviva a un refresh de la página — solo se borra si el
   usuario vacía el buscador él mismo, nunca solo. */
function applyCalendarSearch(query){
  calendarAmountQuery = query;
  try{
    if(query) localStorage.setItem('patron_cal_search', query);
    else localStorage.removeItem('patron_cal_search');
  }catch(e){}
  const q = query.trim().toLowerCase();
  if(!q){
    calendarBlinkDates = [];
    return;
  }
  const matches = receipts.filter(r=>{
    const amountMatch = money(r.total).replace('$','').toLowerCase().includes(q);
    const itemMatch = (r.appliedItems||[]).some(it=>((it.rawName||'')+' '+(it.ingName||'')).toLowerCase().includes(q));
    return amountMatch || itemMatch;
  });
  calendarBlinkDates = matches.map(r=>r.date);
  if(matches.length>0) setCalendarMonth(matches[0].date.slice(0,7));
}

/* Se abre al tocar el nombre del mes arriba del calendario — en vez de ir tocando
   "siguiente" doce veces para llegar a otro mes del mismo año, muestra los 12 meses
   como calendarios chiquitos de verdad (con sus días acomodados), no solo el nombre —
   así también se ve de un vistazo en qué días de cada mes hubo recibos (marcados en
   ámbar). Tocar cualquiera de los 12 calendaritos vuelve a la vista grande de ese mes. */
function yearPickerWidget(){
  const year = parseInt(calendarViewMonth.split('-')[0], 10);
  const todayStr = localDateStr();
  const receiptDatesInYear = new Set(
    receipts.filter(r=>r.date && r.date.slice(0,4)===String(year)).map(r=>r.date)
  );
  const miniMonths = MONTH_NAMES[uiLang].map((name, idx)=>{
    const mk = year+'-'+String(idx+1).padStart(2,'0');
    const isCurrent = mk===calendarViewMonth;
    const firstWeekday = new Date(year, idx, 1).getDay();
    const daysInMonth = new Date(year, idx+1, 0).getDate();
    let dayCells = '';
    for(let i=0;i<firstWeekday;i++) dayCells += '<span class="mini-cal-day empty"></span>';
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = mk+'-'+String(d).padStart(2,'0');
      const hasReceipt = receiptDatesInYear.has(dateStr);
      const isToday = dateStr===todayStr;
      dayCells += `<span class="mini-cal-day ${hasReceipt?'has-receipt':''} ${isToday?'today':''}">${d}</span>`;
    }
    return `
    <button class="cal-year-month ${isCurrent?'current':''}" data-cal-select-month="${mk}">
      <div class="mini-cal-title">${name}</div>
      <div class="mini-cal-grid">${dayCells}</div>
    </button>`;
  }).join('');
  return `
  <div class="cal-widget">
    <div class="cal-header">
      <button class="cal-nav-btn" id="btn-cal-prev-year" title="${t('btn_cal_prev')}">‹</button>
      <button class="cal-month-label" id="btn-cal-month-label" title="${t('btn_cal_month_view')}">${year}<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="cal-nav-btn" id="btn-cal-next-year" title="${t('btn_cal_next')}">›</button>
    </div>
    <div class="cal-year-grid">${miniMonths}</div>
  </div>`;
}

/* Calendario del mes que se muestra arriba de la lista de recibos: cada día con
   un recibo muestra su miniatura, tocarlo lo agranda reusando el mismo modal de
   detalle que ya abre la lista de tarjetas de abajo (mismo atributo data-view-receipt,
   así que el cableado de clicks no se duplica). Si un día tiene MÁS de un recibo, la
   celda muestra el primero con una insignia "×N" encima, y tocarla abre una lista
   corta (dayReceiptsModal) para elegir cuál — así ningún recibo queda inaccesible
   desde el calendario, aunque dos lleguen el mismo día. */
function receiptCalendarWidget(){
  if(!calendarViewMonth) calendarViewMonth = localMonthStr();
  if(calendarShowYearPicker) return yearPickerWidget();
  const [y,m] = calendarViewMonth.split('-').map(Number);
  const firstWeekday = new Date(y, m-1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const todayStr = localDateStr();

  const receiptsByDay = {};
  receipts.forEach(r=>{
    if(!r.date || r.date.slice(0,7)!==calendarViewMonth) return;
    const day = parseInt(r.date.slice(8,10),10);
    if(!receiptsByDay[day]) receiptsByDay[day] = [];
    receiptsByDay[day].push(r);
  });

  const cells = [];
  for(let i=0;i<firstWeekday;i++) cells.push('<div class="cal-day empty"></div>');
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = calendarViewMonth+'-'+String(day).padStart(2,'0');
    const dayReceipts = receiptsByDay[day];
    const r = dayReceipts ? dayReceipts[0] : null;
    const multi = dayReceipts && dayReceipts.length>1;
    const isToday = dateStr===todayStr;
    const cover = r ? receiptImages(r)[0] : null;
    const isBlink = calendarBlinkDates.includes(dateStr);
    const clickAttr = multi ? `data-day-receipts="${dateStr}"` : r ? `data-view-receipt="${r.id}"` : '';
    cells.push(`
      <div class="cal-day ${r?'has-receipt':''} ${isToday?'today':''} ${isBlink?'blink':''}" ${clickAttr} ${r?`title="${multi?dayReceipts.length+' '+t('products_plural'):escapeHtml(r.supplier)||t('no_supplier_name')}"`:''}>
        ${cover ? `<img src="${escapeHtml(receiptImageSrc(cover))}" alt="" loading="lazy" onerror="this.style.display='none'">`

// id incremental para el <linearGradient> del área del gráfico — un id fijo se
// repetiría si el navegador llegara a tener más de un <svg> de este chart en el DOM
// a la vez (no pasa hoy, pero cuesta cero evitarlo de raíz).
let __chartGradientSeq = 0;
function priceHistoryChart(points){
  const W = 560, H = 180, padL = 52, padR = 16, padT = 16, padB = 16;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const prices = points.map(p=>p.unitPrice);
  let min = Math.min(...prices), max = Math.max(...prices);
  if(min===max){ min = min*0.9; max = (max*1.1)||1; } // evita aplanar la gráfica si el precio nunca cambió

  const xFor = (i)=> padL + (points.length===1 ? innerW/2 : (i/(points.length-1))*innerW);
  const yFor = (v)=> padT + innerH - ((v-min)/(max-min))*innerH;

  const first = points[0].unitPrice, last = points[points.length-1].unitPrice;
  const changePct = first>0 ? ((last-first)/first)*100 : 0;
  const trendColor = changePct>3 ? 'var(--tomato)' : changePct<-3 ? 'var(--basil)' : 'var(--navy)';

  const gridLines = [0,0.5,1].map(f=>{
    const y = padT + innerH*f;
    const val = max - (max-min)*f;
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${padL-8}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--ink-soft)" font-family="IBM Plex Mono">${money(val)}</text>`;
  }).join('');

  const linePoints = points.map((p,i)=> `${xFor(i).toFixed(1)},${yFor(p.unitPrice).toFixed(1)}`).join(' ');

  const markers = points.map((p,i)=>{
    const x=xFor(i).toFixed(1), y=yFor(p.unitPrice).toFixed(1);
    return `<circle cx="${x}" cy="${y}" r="4" fill="${trendColor}" stroke="var(--panel)" stroke-width="2">
      <title>${escapeHtml(p.date)} · ${escapeHtml(p.supplier)} · ${money(p.unitPrice)}</title>
    </circle>`;
  }).join('');

  const lastX = xFor(points.length-1), lastY = yFor(last);
  const endLabel = `<text x="${lastX.toFixed(1)}" y="${(lastY-10).toFixed(1)}" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)" font-family="IBM Plex Mono">${money(last)}</text>`;

  // Área bajo la línea con degradado hacia transparente — el mismo dato de siempre,
  // pero se lee de un vistazo como un gráfico "de verdad" en vez de una línea pelada.
  const gradId = 'ph-grad-'+(__chartGradientSeq++);
  const baseline = (padT+innerH).toFixed(1);
  const areaPoints = `${xFor(0).toFixed(1)},${baseline} ${linePoints} ${xFor(points.length-1).toFixed(1)},${baseline}`;

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
    <defs>
      <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${trendColor}" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="${trendColor}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${gridLines}
    <polygon points="${areaPoints}" fill="url(#${gradId})"/>
    <polyline points="${linePoints}" fill="none" stroke="${trendColor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${markers}
    ${endLabel}
  </svg>`;
}

/* Agrupa las compras de un ingrediente por proveedor, para poder comparar quién
   te está cobrando más caro sin tener que leer todo el historial a mano */
function supplierComparisonRows(points){
  const bySupplier = {};
  points.forEach(p=>{
    const key = (p.supplier||'').trim() || t('fallback_unspecified');
    if(!bySupplier[key]) bySupplier[key] = {supplier:key, prices:[], lastDate:'', lastPrice:0};
    bySupplier[key].prices.push(p.unitPrice);
    if(p.date >= bySupplier[key].lastDate){ bySupplier[key].lastDate = p.date; bySupplier[key].lastPrice = p.unitPrice; }
  });
  return Object.values(bySupplier)
    .map(s=>({supplier:s.supplier, lastPrice:s.lastPrice, avgPrice:s.prices.reduce((a,b)=>a+b,0)/s.prices.length, count:s.prices.length}))
    .sort((a,b)=>a.lastPrice-b.lastPrice);
}

function priceHistoryModal(){
  const ing = inventory.find(i=>i.id===priceHistoryIngId);
  if(!ing) return '';
  const allForIng = purchases.filter(p=>p.ingId===ing.id && p.qty>0);
  // Solo se compara el precio entre compras que vinieron en la MISMA unidad que el
  // producto tiene hoy — mezclar libras con cajas en la misma gráfica/tabla daría una
  // tendencia de precio inventada (ver lastPriceChangePct, mismo problema de fondo).
  // Las compras viejas sin "unit" guardado (de antes de este arreglo) también quedan
  // afuera, para no confiar a ciegas en un dato que no se sabe si coincide.
  const points = allForIng
    .filter(p=>p.unit===ing.unit)
    .map(p=>({date:p.date, supplier:p.supplier, unitPrice:p.totalPrice/p.qty}))
    .sort((a,b)=> new Date(a.date)-new Date(b.date));
  const excludedCount = allForIng.length - points.length;
  const supplierRows = supplierComparisonRows(points);

  let summary = '';
  if(points.length>=2){
    const first = points[0].unitPrice, last = points[points.length-1].unitPrice;
    const changePct = first>0 ? ((last-first)/first)*100 : 0;
    const up = changePct>3, down = changePct<-3;
    const color = up?'var(--tomato-ink)':down?'var(--basil)':'var(--ink-soft)';
    const bg = up?'var(--tomato-soft)':down?'var(--basil-soft)':'#FAFAF7';
    const arrow = up?'▲':down?'▼':'→';
    const phrase = (up||down)
      ? `${arrow} ${up?t('ph_up'):t('ph_down')} ${Math.abs(changePct).toFixed(0)}% ${t('ph_since_first')} (${points[0].date})`
      : `${arrow} ${t('ph_no_change')} (${points[0].date})`;
    summary = `<div class="scan-status" style="background:${bg};color:${color};">${phrase}</div>`;
  }

  return `
  <div class="overlay" id="price-history-overlay">
    <div class="modal wide">
      <h3 class="saffron">${t('ph_title_prefix')}${escapeHtml(ing.name)}</h3>
      <div class="sub">${t('ph_sub')}</div>
      ${excludedCount>0 ? `<div class="helper-note" style="margin:0 0 10px;">${t('ph_excluded_units').replace('{n}', excludedCount)}</div>` : ''}
      ${points.length<2 ? `
        <div class="helper-note" style="margin:0 0 16px;">${t('ph_not_enough')} ${points.length}.</div>
      ` : `
        ${summary}
        <div style="margin:14px 0;">${priceHistoryChart(points)}</div>
        ${supplierRows.length>=2 ? `
          <label style="display:block;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:8px;">${t('supplier_compare_title')}</label>
          <div class="ing-list-mini" style="max-height:150px;">
            ${supplierRows.map((s,idx)=>`
              <div class="ing-list-mini-item">
                <span>${escapeHtml(s.supplier)} ${idx===0?`<span class="price-updated">${t('cheapest_label')}</span>`:''}
                  ${s.count>1?`<div style="font-size:10.5px;color:var(--ink-soft);margin-top:2px;">${t('avg_price_label')} ${money(s.avgPrice)}/${escapeHtml(unitLabel(ing.unit))}</div>`:''}
                </span>
                <span class="mono-cell">${money(s.lastPrice)}/${escapeHtml(unitLabel(ing.unit))}</span>
              </div>
            `).join('')}
          </div>
          <div class="helper-note" style="margin-top:6px;">${t('supplier_compare_helper')}</div>
        ` : ''}
        <label style="display:block;font-size:12px;font-weight:700;color:var(--ink);margin:14px 0 8px;">${t('ph_full_history_label')}</label>
        <div class="ing-list-mini" style="max-height:160px;">
          ${points.slice().reverse().map(p=>`
            <div class="ing-list-mini-item">
              <span>${escapeHtml(p.date)} &middot; ${escapeHtml(p.supplier)}</span>
              <span class="mono-cell">${money(p.unitPrice)}/${escapeHtml(unitLabel(ing.unit))}</span>
            </div>
          `).join('')}
        </div>
      `}
      <div class="modal-actions">
        <button class="btn btn-ghost" id="btn-close-price-history" style="flex:1;">${t('btn_close')}</button>
      </div>
    </div>
  </div>`;
}

function monthlySpendChart(monthsAsc, currentMonthKey){
  const W = 560, H = 200, padL = 52, padR = 16, padT = 16, padB = 28;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const spends = monthsAsc.map(m=>spendForMonth(m));
  const max = Math.max(...spends, 1);

  const n = monthsAsc.length;
  const slot = innerW / n;
  const barW = Math.min(slot * 0.55, 24);

  const gridLines = [0,0.5,1].map(f=>{
    const y = padT + innerH*(1-f);
    const val = max*f;
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${padL-8}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--ink-soft)" font-family="IBM Plex Mono">${money(val)}</text>`;
  }).join('');

  // El mes actual se destaca con el mismo degradé navy→basil de la marca (brand-mark,
  // el ícono de escanear, el badge del dashboard vacío) en vez de un azul plano —
  // así el ojo va directo al mes que importa sin perder la comparación con el resto.
  const barGradId = 'ms-grad-'+(__chartGradientSeq++);
  const bars = monthsAsc.map((m,i)=>{
    const spend = spends[i];
    const barH = max>0 ? (spend/max)*innerH : 0;
    const x = padL + i*slot + (slot-barW)/2;
    const y = padT + innerH - barH;
    const isCurrent = m===currentMonthKey;
    const fill = isCurrent ? `url(#${barGradId})` : '#B7C4CC';
    return `
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(barH,2).toFixed(1)}" rx="4" fill="${fill}">
        <title>${escapeHtml(monthLabel(m, uiLang))} · ${money(spend)}</title>
      </rect>
      <text x="${(x+barW/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)" font-family="IBM Plex Mono">${money(spend)}</text>
      <text x="${(x+barW/2).toFixed(1)}" y="${(padT+innerH+16).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--ink-soft)" font-family="IBM Plex Mono">${escapeHtml(monthLabel(m, uiLang))}</text>
    `;
  }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
    <defs>
      <linearGradient id="${barGradId}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--basil)"/>
        <stop offset="100%" stop-color="var(--navy)"/>
      </linearGradient>
    </defs>
    ${gridLines}
    ${bars}
  </svg>`;
}

function openDeleteAccountModal(){

function closeDeleteAccountModal(){ showDeleteAccountModal=false; render(); }

// Firebase exige una sesión "reciente" antes de dejar borrar una cuenta
// (reauthenticateWith* falla con auth/requires-recent-login si no) — se rama por
// proveedor real: 'password' cubre tanto una cuenta normal de email/contraseña
// como las cuentas sintéticas de nombre+PIN del modo equipo (teamPinEmail()), que
// también son 'password' por debajo. 'google.com' reusa el mismo patrón
// popup-con-fallback-a-redirect que ya usa signInWithGoogle().
async function performAccountDeletion(){
  if(!currentUser) return;
  deleteAccountLoading = true; deleteAccountError=''; render();
  try{
    const provider = (currentUser.providerData[0] && currentUser.providerData[0].providerId) || 'password';
    if(provider==='google.com'){
      try{
        await currentUser.reauthenticateWithPopup(new firebase.auth.GoogleAuthProvider());
      }catch(err){
        const popupFailed = err && (err.code==='auth/popup-blocked' || err.code==='auth/operation-not-supported-in-this-environment' || err.code==='auth/cancelled-popup-request');
        if(popupFailed){
          // El popup no se pudo abrir — se reintenta con redirect, pero a
          // diferencia del popup, esto recarga la página entera. No hay forma
          // liviana de "retomar el borrado solo" después de volver de un
          // redirect sin sumar bastante más estado — en la práctica alcanza con
          // que, al volver, la sesión ya cuenta como reciente y un segundo toque
          // en "Eliminar cuenta" complete el resto sin pedir reautenticar de nuevo.
          await currentUser.reauthenticateWithRedirect(new firebase.auth.GoogleAuthProvider());
          return;
        }
        throw err;
      }
    } else {
      if(!deleteAccountPassword){ deleteAccountError=t('auth_err_need_both'); deleteAccountLoading=false; render(); return; }
      const cred = firebase.auth.EmailAuthProvider.credential(currentUser.email, deleteAccountPassword);
      await currentUser.reauthenticateWithCredential(cred);
    }

    // getIdToken(true) fuerza un token fresco — el que ya estaba en memoria puede
    // ser de antes de reautenticar, y el servidor (delete-account.js) exige uno
    // válido para saber a qué cuenta borrar.
    const idToken = await currentUser.getIdToken(true);
    const response = await fetch('/.netlify/functions/delete-account', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+idToken},
      body: JSON.stringify({})
    });
    const parsed = await response.json().catch(()=>({}));
    if(!response.ok || parsed.error){ throw new Error(parsed.error || t('auth_err_generic')); }

    // La cuenta ya no existe del lado del servidor — se limpia todo localmente
    // (listeners, estado en memoria, localStorage) y se cierra sesión, en vez de
    // esperar a que onAuthStateChanged se entere solo de una cuenta que ya no está.
    detachFirestoreListeners();
    detachTeamListener();
    stopPresenceHeartbeat();
    try{ await firebase.auth().signOut(); }catch(e){}
    inventory=[]; purchases=[]; receipts=[]; deletedInventoryIds=[]; deletedReceiptIds=[]; deletedPurchaseIds=[]; aliasMap={};
    joinedOwnerUid=null; joinedOwnerEmail=''; lastSyncedUid=null;
    try{
      localStorage.removeItem('patron_had_session');
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(LEGACY_STORAGE_KEY);
    }catch(e){}
    showDeleteAccountModal=false; deleteAccountLoading=false;
    alert(t('delete_account_success'));
    render();
  }catch(err){
    deleteAccountLoading=false;
    if(err && err.code==='auth/popup-closed-by-user'){ render(); return; } // cerró el popup, no es un error real
    if(err && (err.code==='auth/wrong-password' || err.code==='auth/invalid-credential')) deleteAccountError=t('auth_err_wrong_password');
    else { console.error('[Dusty] account deletion failed:', err); deleteAccountError = (err && err.message) || t('auth_err_generic'); }
    render();
  }
}

// usa el resto de la app para agrupar conceptos (ver el comentario de settingsCardHeader

// "compartir/positivo" en Configuración.

// el usuario realmente hace ("escaneo" + "se actualiza solo" son un solo momento, igual

const WELCOME_STEPS = [
  {icon:'camera', bg:'var(--sky-soft)',     fg:'var(--sky)',        titleKey:'welcome_step1_title', subKey:'welcome_step1_sub'},
  {icon:'bell',   bg:'var(--saffron-soft)', fg:'var(--saffron-ink)',titleKey:'welcome_step2_title', subKey:'welcome_step2_sub'},
  {icon:'share',  bg:'var(--tomato-soft)',  fg:'var(--tomato-ink)', titleKey:'welcome_step3_title', subKey:'welcome_step3_sub'}
];
function closeWelcomeModal(){
  showWelcomeModal = false;
  welcomeStep = 0;
  welcomeStepAnimated = false;
  try{ localStorage.setItem('patron_onboarded','1'); }catch(e){}
  render();
}
function advanceWelcomeStep(){
  if(welcomeStep < WELCOME_STEPS.length-1){ welcomeStepDir=1; welcomeStep++; welcomeStepAnimated = false; render(); }
  else closeWelcomeModal();
}
function retreatWelcomeStep(){
  if(welcomeStep>0){ welcomeStepDir=-1; welcomeStep--; welcomeStepAnimated = false; render(); }
}
// Saltar directo a un paso tocando su puntito, en vez de tener que ir de a uno — la
// dirección del deslizamiento se calcula igual que avanzar/retroceder a mano, así el
// salto se siente consistente con el resto del tutorial en vez de un corte seco.
function jumpToWelcomeStep(i){
  if(i===welcomeStep || i<0 || i>=WELCOME_STEPS.length) return;

/* ================= MODAL: INICIAR SESIÓN (Google o email/contraseña) ================= */
// "note" es opcional: un mensaje informativo (no un error) que explica POR QUÉ se le
// pide iniciar sesión justo ahora — por ejemplo, al tocar "Escanear recibo" sin cuenta
// (ver openScanModal). Sin esto, alguien que nunca vio la app se encontraba con un
// login pelado, sin entender qué lo disparó.
function openAuthModal(note){ authMode='signin'; authError=''; authContextNote=note||''; authLoading=false; authEmail=''; authPassword=''; authName=''; authPin=''; authPinConfirm=''; authJoinCode=''; showAuthModal=true; render(); }
function closeAuthModal(){ showAuthModal=false; authError=''; authContextNote=''; authEmail=''; authPassword=''; authName=''; authPin=''; authPinConfirm=''; authJoinCode=''; render(); }
/* PIN de equipo: en vez de pedirle un email a alguien que solo necesita entrar al
   inventario compartido de otra persona, se arma una cuenta real de Firebase Auth
   por atrás con un email inventado que sale del nombre (así puede volver a entrar
   después solo con nombre+PIN, sin tener que recordar ningún email). El PIN es el
   password real de esa cuenta — por eso tiene que tener al menos 6 caracteres, el
   mínimo que exige Firebase, aunque en la práctica funcione como un PIN. */
function slugifyName(name){
  return (name||'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,40);
}
// El email se arma con nombre + código de equipo (no solo el nombre) para que quede
// aislado por negocio: dos cuentas distintas de Dusty pueden tener cada una a su
// propia "Maria" sin pisarse ni poder loguearse una en la cuenta de la otra.
function teamPinEmail(name, code){ return slugifyName(name)+'.'+(code||'').toString().trim().toLowerCase()+'@patron-team.local'; }
// Formato viejo (solo nombre, sin código) — se usa como respaldo al iniciar sesión
// para no dejar afuera a cuentas creadas antes de este cambio.
function legacyTeamPinEmail(name){ return slugifyName(name)+'@patron-team.local'; }
// Para mostrar en pantalla: el nombre real de una cuenta de nombre+PIN (guardado en
// displayName al crearla) en vez de su email inventado — para cuentas normales
// (Google/email), sigue siendo el email de siempre.
function currentUserLabel(){
  if(!currentUser) return '';
  return currentUser.displayName || currentUser.email || '';
}
/* currentUser arranca en null en CADA carga de página y recién se llena cuando
   Firebase termina de cargar y confirmar la sesión (siempre tarda un momento, hay
   red de por medio) — mientras tanto, cualquier parte de la interfaz que dependa
   de "hay sesión iniciada" cambiaría de forma visible apenas Firebase responde
   (ej. el botón de "Cambios" en Inventario aparecía de golpe y encogía a los otros
   dos botones de al lado, que reparten el ancho entre los tres). patron_had_session
   se sabe DESDE EL PRIMER dibujado (no depende de red), así que usarlo en vez de
   currentUser para decidir el LAYOUT deja todo asentado en su lugar final desde el
   principio — el contenido en sí (los datos) sigue esperando a Firebase como
   siempre, pero la forma de la pantalla no pega el salto. */
function hadCloudSessionBefore(){
  try{ return !!localStorage.getItem('patron_had_session'); }catch(e){ return false; }
}
/* "Quién está activo": cada miembro (no el dueño — a sí mismo obviamente se ve
   activo, no necesita Firestore para saberlo) manda una señal cada 30s mientras
   tiene la pestaña visible, escribiendo en SU PROPIO doc de membresía (mismo
   permiso de siempre: cada quien escribe su propio users/{dueño}/members/{miUid}).
   El dueño, mirando la lista de miembros en tiempo real, decide "activo ahora" si
   la última señal es reciente — no es instantáneo como un chat, pero para saber
   quién está usando la app en este momento alcanza, y el costo extra en Firestore
   es mínimo comparado con la sincronización del inventario. */
const PRESENCE_INTERVAL_MS = 30000;
const PRESENCE_ACTIVE_WINDOW_MS = PRESENCE_INTERVAL_MS * 3;
let presenceHeartbeatTimer = null;
function sendPresenceHeartbeat(){
  if(!currentUser || !joinedOwnerUid) return;
  if(typeof document!=='undefined' && document.visibilityState==='hidden') return;
  membersRef(joinedOwnerUid).doc(currentUser.uid).set({lastActive: new Date().toISOString()}, {merge:true}).catch(()=>{});
}
function startPresenceHeartbeat(){
  stopPresenceHeartbeat();
  sendPresenceHeartbeat();
  presenceHeartbeatTimer = setInterval(sendPresenceHeartbeat, PRESENCE_INTERVAL_MS);
}
function stopPresenceHeartbeat(){
  if(presenceHeartbeatTimer) clearInterval(presenceHeartbeatTimer);
  presenceHeartbeatTimer = null;
}
function isRecentlyActive(iso){
  return !!iso && (Date.now() - new Date(iso).getTime()) < PRESENCE_ACTIVE_WINDOW_MS;
}
// Reusado tanto por joinTeam() (alguien que ya tenía cuenta) como por submitQuickJoin()
// (cuenta nueva con nombre+PIN recién creada) — es la parte de "empezar a mirar el
// inventario del dueño" que es idéntica en los dos casos.
function applyJoinedTeam(ownerUid, ownerEmail){
  detachFirestoreListeners();
  detachTeamListener();
  // Esta limpieza es una transición de árbol de datos, no una edición real — no debe
  // disparar una subida a la nube con estado vacío (ver nota completa en joinTeam()).
  applyingRemoteSnapshot = true;
  inventory=[]; purchases=[]; receipts=[]; deletedInventoryIds=[]; deletedReceiptIds=[]; deletedPurchaseIds=[]; aliasMap={};
  joinedOwnerUid = ownerUid; joinedOwnerEmail = ownerEmail;
  lastSyncedUid = ownerUid;
  saveState();
  applyingRemoteSnapshot = false;
  attachFirestoreListeners(joinedOwnerUid);
  startPresenceHeartbeat();
}
function submitQuickJoin(){
  const code = (authJoinCode||'').trim().toUpperCase();
  const name = (authName||'').trim();
  if(!code){ authError=t('team_err_need_code'); render(); return; }
  if(!name){ authError=t('auth_err_need_name'); render(); return; }
  if(authPin.length<6){ authError=t('auth_err_pin_short'); render(); return; }
  if(authPin!==authPinConfirm){ authError=t('auth_err_pin_mismatch'); render(); return; }
  authLoading=true; authError=''; render();
  ensurePatronFirebaseReady().then(()=>inviteCodeRef(code).get()).then(doc=>{
    if(!doc.exists){ const e=new Error('not-found'); e.code='not-found'; throw e; }
    const ownerUid = doc.data().ownerUid, ownerEmail = doc.data().ownerEmail||'';
    const email = teamPinEmail(name, code);
    return firebase.auth().createUserWithEmailAndPassword(email, authPin).then(cred=>{
      // Se guarda el nombre real en el perfil de Firebase — currentUserLabel() lo usa
      // en vez del email inventado en todos los lugares que muestran "quién sos"
      // (tooltip de sincronizado, reportar un problema, lista de miembros si esta
      // cuenta después invita a alguien más).
      return cred.user.updateProfile({ displayName: name }).then(()=>
        // `code` obligatorio: las reglas exigen probar un código de invitación válido de
        // este dueño para crear la membresía (mismo motivo que en joinTeam()).
        membersRef(ownerUid).doc(cred.user.uid).set({ email: name, joinedAt: new Date().toISOString(), code })
      )
        .then(()=>joinedRef(cred.user.uid).set({ownerUid, ownerEmail}))
        .then(()=>{
          // No se confía en que el listener genérico de onAuthStateChanged (que puede
          // disparar en cualquier momento apenas se crea la cuenta) se entere solo del
          // doc "joined" recién escrito — se fuerza acá mismo, así queda bien sin
          // importar el orden en que lleguen los eventos.
          applyJoinedTeam(ownerUid, ownerEmail);
        });
    });
  }).then(()=>{
    authLoading=false; showAuthModal=false;
    authName=''; authPin=''; authPinConfirm=''; authJoinCode='';
    render();
  }).catch(err=>{
    authLoading=false;
    if(err && err.code==='not-found') authError=t('team_err_not_found');
    else if(err && err.code==='auth/email-already-in-use') authError=t('auth_err_name_taken');
    else if(err && err.code==='auth/weak-password') authError=t('auth_err_pin_short');
    else { console.error('[Dusty] quick join failed:', err); authError=t('auth_err_generic'); }
    render();
  });
}
function submitPinLogin(){
  const name = (authName||'').trim();
  const code = (authJoinCode||'').trim().toUpperCase();
  if(!code){ authError=t('team_err_need_code'); render(); return; }
  if(!name){ authError=t('auth_err_need_name'); render(); return; }
  if(!authPin){ authError=t('auth_err_need_pin'); render(); return; }
  authLoading=true; authError=''; render();
  ensurePatronFirebaseReady().then(()=>{
    return firebase.auth().signInWithEmailAndPassword(teamPinEmail(name, code), authPin).catch(err=>{
      // Cuentas creadas antes de que el email empezara a incluir el código de equipo
      // todavía usan el formato viejo (solo nombre) — se reintenta una vez ahí para
      // no dejarlas afuera.
      if(err && err.code==='auth/user-not-found'){
        return firebase.auth().signInWithEmailAndPassword(legacyTeamPinEmail(name), authPin);
      }
      throw err;
    });
  }).then(()=>{
    authLoading=false; showAuthModal=false;
    authName=''; authPin=''; authJoinCode=''; render();
  }).catch(err=>{
    authLoading=false;
    authError = (err && (err.code==='auth/user-not-found' || err.code==='auth/wrong-password' || err.code==='auth/invalid-credential')) ? t('auth_err_pin_wrong') : t('auth_err_generic');
    if(err && err.code!=='auth/user-not-found' && err.code!=='auth/wrong-password' && err.code!=='auth/invalid-credential') console.error('[Dusty] pin login failed:', err);
    render();
  });
}
function authErrorMessage(code){
  const map = {
    'auth/email-already-in-use': t('auth_err_email_in_use'),
    'auth/invalid-email': t('auth_err_invalid_email'),
    'auth/weak-password': t('auth_err_weak_password'),
    'auth/wrong-password': t('auth_err_wrong_password'),
    'auth/user-not-found': t('auth_err_user_not_found'),
    'auth/invalid-credential': t('auth_err_wrong_password'),
    'auth/too-many-requests': t('auth_err_too_many'),
    'auth/operation-not-allowed': t('auth_err_provider_disabled')
  };
  return (code && map[code]) || t('auth_err_generic');
}
// La misma lógica popup->redirect que ya usaba el botón de la nube directamente,
// ahora reusada tanto ahí (para cerrar sesión) como desde el botón de Google
// dentro de este modal.
function signInWithGoogle(){
  authLoading = true; authError=''; render();
  return ensurePatronFirebaseReady().then(()=>{
    return firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());
  }).catch(err=>{
    const popupFailed = err && (err.code==='auth/popup-blocked' || err.code==='auth/operation-not-supported-in-this-environment' || err.code==='auth/cancelled-popup-request');
    if(popupFailed) return firebase.auth().signInWithRedirect(new firebase.auth.GoogleAuthProvider());
    if(err && err.code!=='auth/popup-closed-by-user'){
      console.error('[Dusty] sign-in failed:', err);
      authError = authErrorMessage(err.code);
    }
  }).catch(err=>{
    console.error('[Dusty] sign-in redirect failed:', err);
  }).then(()=>{
    authLoading = false; render();
  });
}

// La librería de lectura de código de barras (html5-qrcode) pesa lo suyo — se carga
// recién la primera vez que alguien toca "Código de barras", igual que Firebase con
// ensurePatronFirebaseReady() más arriba, así nadie que no use esto paga el costo.
let barcodeLibLoadPromise = null;
function ensureBarcodeLibReady(){
  if(barcodeLibLoadPromise) return barcodeLibLoadPromise;
  barcodeLibLoadPromise = loadExternalScript('https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js');
  return barcodeLibLoadPromise;
}
function openBarcodeScanModal(){
  if(!currentUser){
    ensurePatronFirebaseReady().then(()=>openAuthModal(t('scan_requires_account')));
    return;
  }
  barcodeScanState='scanning'; barcodeScanError='';
  showBarcodeScanModal=true; render();
  // render() de arriba ya puso el <div id="barcode-reader"> vacío en el DOM antes de
  // que esta promesa se resuelva (la carga del script es async, el render fue
  // sincrónico) — para cuando entramos acá, el elemento ya existe.
  ensureBarcodeLibReady().then(()=>{
    startBarcodeScanner();
  }).catch(()=>{
    barcodeScanState='error'; barcodeScanError=t('barcode_scan_camera_error'); render();
  });
}
function startBarcodeScanner(){
  const el = document.getElementById('barcode-reader');
  // Si el modal ya se cerró (el usuario tocó "Cancelar") mientras la librería
  // todavía estaba cargando, el div ya no existe — no arrancar la cámara para nada.
  if(!el || typeof Html5Qrcode==='undefined') return;
  barcodeScannerInstance = new Html5Qrcode('barcode-reader', {
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128
    ],
    verbose: false
  });
  barcodeScannerInstance.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 260, height: 150 } },
    (decodedText)=>{ onBarcodeDetected(decodedText); },
    ()=>{} // "no se encontró ningún código en este cuadro" — pasa en CADA cuadro sin código, no es un error real
  ).catch(()=>{
    // Si start() nunca llegó a levantar cámara, no queda ningún <video> vivo que
    // proteger — hay que soltar la referencia ACÁ, si no el guard de render() de
    // arriba (que pospone redibujados mientras barcodeScannerInstance exista) deja
    // TODA la app trabada sin volver a redibujar nunca más, no solo este modal.
    barcodeScannerInstance = null;
    barcodeScanState='error'; barcodeScanError=t('barcode_scan_camera_error'); render();
  });
}
async function stopBarcodeScanner(){
  if(!barcodeScannerInstance) return;
  const instance = barcodeScannerInstance;
  barcodeScannerInstance = null;
  try{ await instance.stop(); }catch(e){}
  try{ instance.clear(); }catch(e){}
}
function closeBarcodeScanModal(){
  stopBarcodeScanner();
  showBarcodeScanModal=false; render();
}
// Se llama con cada código que la cámara logra leer — el guard de arriba evita
// procesar el mismo código varias veces seguidas mientras la librería sigue mandando
// cuadros antes de que la cámara termine de apagarse.
async function onBarcodeDetected(code){
  if(barcodeScanState!=='scanning' || !barcodeScannerInstance) return;
  // Se limpia la referencia YA MISMO (no se espera a que termine instance.stop(), que
  // es async) — el guard de render() de arriba pospone cualquier redibujado mientras
  // barcodeScannerInstance exista, así que si esperáramos acá el "Buscando el
  // producto…" de abajo jamás llegaría a pintarse hasta que la cámara termine de
  // apagarse del todo. La cámara igual se apaga en paralelo, sin bloquear la UI.
  const instance = barcodeScannerInstance;
  barcodeScannerInstance = null;
  barcodeScanState='looking'; render();
  try{ await instance.stop(); }catch(e){}
  try{ instance.clear(); }catch(e){}
  try{
    // Open Food Facts: base pública, sin API key, sin costo — cubre bien productos de
    // marca (sobre todo comida/bebida), pero no todo lo que un negocio pueda escanear
    // (insumos genéricos sin marca, por ejemplo). Si no está, se avisa y se completa a
    // mano — nunca se inventa un producto para un código que no se encontró.
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json`);
    const data = await res.json();
    if(data && data.status===1 && data.product && (data.product.product_name || data.product.generic_name)){
      draftItem.name = data.product.product_name || data.product.generic_name;
      draftItem.sku = code;
      showBarcodeScanModal=false;
      barcodeScanState='scanning';
      render();
    } else {
      barcodeScanState='notfound'; render();
    }
  }catch(e){
    barcodeScanState='notfound'; render();
  }
}
function barcodeScanModal(){
  return `
  <div class="overlay" id="barcode-scan-overlay">

// Confirmado el long-press (ver el pointerdown que llama a esto en attachEvents), la
// fila se levanta y sigue al dedo — mismo truco de reinserción en vivo en el DOM que
// attachCategoryChipDragHandlers ya usa para los chips del Dashboard (reordenar se
// SIENTE al arrastrar, no recién al soltar), solo que en vertical y sin re-basear tx
// contra un límite: acá no hay scroll propio que disputar, el límite es la lista misma.
// draftCategories NUNCA se toca mientras se arrastra — la reordenada real, leyendo el
// DOM (data-cat-id de cada fila), pasa una sola vez al soltar, junto con el único
// render() de todo el gesto.
function beginCategoryDrag(row, list, pointerId, startY){
  if(list) list.classList.add('reordering');
  row.classList.add('dragging');
  row.style.position = 'relative';
  row.style.zIndex = '5';
  let baseY = startY, ty = 0;
  function onMove(e){
    if(e.pointerId!==pointerId) return;
    e.preventDefault();
    ty += e.clientY - baseY;
    baseY = e.clientY;
    row.style.transform = `translateY(${ty}px)`;
    const visualTopBefore = row.getBoundingClientRect().top;
    const prev = row.previousElementSibling;
    const next = row.nextElementSibling;
    let moved = false;
    if(prev && prev.dataset && prev.dataset.catId){
      const r = prev.getBoundingClientRect();
      if(visualTopBefore < r.top + r.height/2){ list.insertBefore(row, prev); moved = true; }
    }
    if(!moved && next && next.dataset && next.dataset.catId){
      const rh = row.getBoundingClientRect().height;
      const r = next.getBoundingClientRect();
      if(visualTopBefore + rh > r.top + r.height/2){ list.insertBefore(row, next.nextElementSibling); moved = true; }
    }
    if(moved){
      // Mismo re-base que los chips: la fila cambió de posición NATURAL en el flujo al
      // reinsertarse — sin esto pegaría un salto seco hacia donde ahora "le toca" estar
      // antes de seguir al dedo.
      const naturalTopPlusOldTy = row.getBoundingClientRect().top;
      const naturalTopNew = naturalTopPlusOldTy - ty;
      ty = visualTopBefore - naturalTopNew;
      row.style.transform = `translateY(${ty}px)`;
    }
  }
  function onUp(e){
    if(e.pointerId!==pointerId) return;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    row.classList.remove('dragging');
    row.style.transform = ''; row.style.position = ''; row.style.zIndex = '';
    if(list) list.classList.remove('reordering');
    const domOrder = [...list.querySelectorAll('.category-edit-row[data-cat-id]')].map(r=>r.dataset.catId);
    const reordered = domOrder.map(id=>draftCategories.find(c=>c.id===id)).filter(Boolean);
    if(reordered.length===draftCategories.length) draftCategories = reordered;
    render();
  }
  document.addEventListener('pointermove', onMove, {passive:false});
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
}
