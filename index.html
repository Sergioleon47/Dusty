<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Sin user-scalable=no ni maximum-scale: bloquear el pellizco para hacer zoom es
     una barrera de accesibilidad real (WCAG 1.4.4) y Android SÍ lo respeta (iOS lo
     ignora hace años). Efecto secundario asumido: Safari de iOS vuelve a hacer su
     auto-zoom al enfocar inputs de menos de 16px — molesto pero reversible con un
     pellizco; la alternativa (nadie con vista cansada puede agrandar NADA en
     Android, la plataforma principal) es peor. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dusty — Inventario</title>
<meta name="description" content="Scan receipts, track inventory, stay on budget, and catch price changes automatically — for stores, restaurants, and anyone reselling on their own.">
<!-- theme-color = el fondo oscuro de la app (no el naranja de marca): en Android
     pinta la barra de estado/sistema — con el naranja quedaría un marco brillante
     alrededor de una interfaz oscura. -->
<meta name="theme-color" content="#0f1115">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%23ff6b35'/%3E%3Ctext x='24' y='34' font-family='Arial, sans-serif' font-weight='700' font-size='28' fill='white' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<!-- "Agregar a inicio" saca la barra de Safari/Chrome y, con ella, el gesto de
     "volver atrás" del sistema desde el borde de la pantalla — el que competía con
     deslizar entre pestañas en un celular real (ver attachViewSwipeHandlers). Sin
     esto la app solo puede ser, como mucho, un sitio con forma de app; con esto pasa
     a abrirse standalone, sin chrome del navegador. -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dusty">
<meta property="og:type" content="website">
<meta property="og:url" content="https://patronsc.netlify.app/">
<meta property="og:title" content="Dusty — Inventory">
<meta property="og:description" content="Scan receipts, track inventory, stay on budget, and catch price changes automatically.">
<meta property="og:image" content="https://patronsc.netlify.app/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Dusty — Inventory">
<meta name="twitter:description" content="Scan receipts, track inventory, stay on budget, and catch price changes automatically.">
<meta name="twitter:image" content="https://patronsc.netlify.app/og-image.png">
<!-- Falta preconectar a fonts.gstatic.com (donde viven los archivos de fuente en
     sí, un dominio DISTINTO de fonts.googleapis.com de arriba, que solo sirve el
     CSS) era justo lo que alargaba el parpadeo de tipografía al cargar: sin esto,
     el navegador recién se entera de que necesita gstatic.com al leer el CSS, y
     arranca esa conexión (DNS+TLS) desde cero recién ahí, en serie después de la de
     googleapis.com — con las dos precoconectadas en paralelo desde el arranque, las
     fuentes reales llegan antes y la letra de reemplazo se ve menos tiempo. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dusty.css">
</head>
<body>
<div id="app"></div>

<script src="morphdom-umd.min.js"></script>
<script src="patron-core.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('/sw.js').catch(err=>{
      console.error('[Dusty] service worker registration failed:', err);
    });
  });
}
</script>
<script src="app-01-estado.js"></script>
<script src="app-02-nube.js"></script>
<script src="app-03-base.js"></script>
<script src="app-04-render.js"></script>
<script src="app-05-vistas.js"></script>
<script src="app-06-modales.js"></script>
<script src="app-07-eventos.js"></script>
</body>
</html>
