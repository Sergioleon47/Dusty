<meta name="theme-color" content="#E8562C">

<!-- "Agregar a inicio" saca la barra de Safari/Chrome y, con ella, el gesto de
     "volver atrás" del sistema desde el borde de la pantalla — el que competía con
     deslizar entre pestañas en un celular real (ver attachViewSwipeHandlers). Sin
     esto la app solo puede ser, como mucho, un sitio con forma de app; con esto pasa
     a abrirse standalone, sin chrome del navegador. -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dusty">

<meta property="og:url" content="https://patronsc.netlify.app/">
<meta property="og:title" content="Dusty — Inventory">
<meta property="og:description" content="Scan receipts, track inventory, stay on budget, and catch price changes automatically.">
<meta property="og:image" content="https://patronsc.netlify.app/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Dusty — Inventory">
<meta name="twitter:description" content="Scan receipts, track inventory, stay on budget, and catch price changes automatically.">
<meta name="twitter:image" content="https://patronsc.netlify.app/og-image.png">
<!-- Falta preconectar a fonts.gstatic.com (donde viven los archivos de fuente en
     sí, un dominio DISTINTO de fonts.googleapis.com de arriba, que solo sirve el
     CSS) era justo lo que alargaba el parpadeo de tipografía al cargar: sin esto,
     el navegador recién se entera de que necesita gstatic.com al leer el CSS, y
     arranca esa conexión (DNS+TLS) desde cero recién ahí, en serie después de la de
     googleapis.com — con las dos precoconectadas en paralelo desde el arranque, las
     fuentes reales llegan antes y la letra de reemplazo se ve menos tiempo. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F0F2F5; --panel:#FFFFFF; --ink:#1C1E21; --ink-soft:#45474B; --line:#DDDFE2;
    /* Paleta "Dusty" (inspirada en el avión Dusty Crophopper de Planes): naranja
       cálido como color de marca/acciones principales, celeste como su pareja en
       los degradés de marca (logo, barra inferior, badges) — "avión contra el
       cielo". --basil se queda en verde a propósito: es el color SEMÁNTICO de
       "todo bien" (stock ok, precio bajó, presencia activa) en toda la app, no
       tiene que ver con la marca — cambiarlo confundiría esos indicadores. */
    --navy:#E8562C; --navy-soft:#F0703F; --tomato:#E5484D; --saffron:#F5A623; --basil:#25D366;
    --basil-soft:#E5F9EA; --tomato-soft:#FCE7E7; --saffron-soft:#FDF0DA; --navy-wash:#FCE7DE;
    --sky:#5AAAD6; --sky-bright:#7EC8ED; --sky-soft:#E5F1F9;
    --radius:14px;
    --stock-ok:#25D366; --stock-warn:#F5A623; --stock-crit:#E5484D;
    /* Variantes hover/press calculadas con color-mix() en vez de hex sueltos
       repetidos por todo el archivo (var(--saffron-press), var(--tomato-ink), var(--basil-ink)...) — un solo lugar
       para ajustar "cuánto se oscurece al tocar" en toda la app. */
    --navy-press:color-mix(in oklch, var(--navy), black 18%);
    --saffron-press:color-mix(in oklch, var(--saffron), black 20%);
    --tomato-press:color-mix(in oklch, var(--tomato), black 18%);
    --basil-press:color-mix(in oklch, var(--basil), black 18%);
    --tomato-ink:color-mix(in oklch, var(--tomato), black 32%);
    --sky-ink:color-mix(in oklch, var(--sky), black 32%);
    --saffron-ink:color-mix(in oklch, var(--saffron), black 38%);
    --basil-ink:color-mix(in oklch, var(--basil), black 38%);
    --navy-ink:color-mix(in oklch, var(--navy), black 20%);
    --focus-ring:color-mix(in oklch, var(--navy), transparent 55%);
    /* Sombras con un tinte muy leve de marca en vez de negro puro — se sienten
       "diseñadas" en vez de una sombra CSS por defecto, sin llegar a notarse como
       color. Tres niveles de elevación: pills/botones chicos, tarjetas, modales. */
    --shadow-sm:0 1px 2px rgba(42,22,14,0.10);
    --shadow:0 1px 2px rgba(42,22,14,0.07), 0 8px 24px rgba(42,22,14,0.09);
    --shadow-lg:0 12px 20px rgba(42,22,14,0.10), 0 24px 64px rgba(42,22,14,0.20);
    --ease-spring:cubic-bezier(0.16,1,0.3,1);
    --ease-soft:cubic-bezier(0.4,0,0.2,1);
  }
  *{box-sizing:border-box;}
  html{touch-action:manipulation;}
  body{margin:0;background:radial-gradient(ellipse 900px 480px at 50% -60px, var(--sky-bright) 0%, var(--navy) 52%, var(--bg) 86%) var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation;}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
  /* Foco de teclado consistente en toda la app (accesibilidad + look pulido) —
     antes solo los inputs de formulario tenían anillo de foco definido. */
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
    outline:2px solid var(--focus-ring);outline-offset:2px;
  }
  /* touch-action:pan-y en TODA la app (no solo en el área de las pestañas) — el
     gesto de deslizar entre pestañas ahora agarra el dedo empiece donde empiece
     (barra de arriba, tarjetas, barra de abajo), no solo el área en blanco del
     medio; ver attachViewSwipeHandlers(). user-select:none + touch-callout:none
     evita que un arrastre un poco lento se confunda con "seleccionar texto" o
     dispare el menú de copiar/compartir de iOS a mitad de gesto — eso competía con
     el swipe y era una causa real de que a veces no arrancara. Los campos de texto
     (input/textarea) igual se pueden seleccionar y editar normal, esto no los toca. */
  #app{max-width:1180px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 24px 100px;touch-action:pan-y;-webkit-touch-callout:none;user-select:none;}
  #app input, #app textarea, #app select{-webkit-user-select:text;user-select:text;}

  /* Las 3 pestañas (dashboard/inventario/recibos) viven SIEMPRE las 3 en el DOM,
     una al lado de la otra dentro de .view-track (tres veces el ancho, cada página
     un tercio) — así se puede deslizar el dedo y ver la pestaña de al lado venir,
     en vez de solo un salto seco al soltar. .view-viewport recorta lo que no
     corresponde mostrar. switchToTab()/el gesto de deslizar mueven el transform del
     track directamente cuadro a cuadro (animateTrackTo(), un resorte real en JS,
     no una transition de CSS) — recién cuando el resorte se asienta se actualiza
     activeTab y se vuelve a dibujar todo con render(), que para entonces ya no
     tiene nada que animar. */
  /* align-items:flex-start para que cada página mida su propio alto real — sin esto
     flex estira las 3 a la altura de la más alta (normalmente Inventario, si hay
     muchos productos), y ver el Dashboard dejaría un hueco vacío enorme abajo antes
     de poder hacer scroll hasta el final. .view-viewport ajusta su alto al de la
     página activa nada más (ver syncViewportHeight) — si no, el body scrollearía
     hasta el alto de la página MÁS larga de las 3 sin importar cuál se esté viendo. */
  /* El fondo (gris liso solo desde donde termina el contenido real hacia abajo) lo
     arma syncViewportHeight() en JS, no acá — ver la nota ahí. Dejarlo fijo acá
     taparía tambien la parte de ARRIBA (donde el contenido real sí está, y el degradé
     verde de marca del <body> se sigue viendo bien detrás, a propósito, en los huecos
     entre tarjetas cerca del header). */
  .view-viewport{overflow:hidden;touch-action:pan-y;}
  /* will-change:transform promueve el track a su propia capa de composición: el
     navegador anima el transform en la GPU, así el arrastre y el resorte se ven
     fluidos aunque el hilo principal esté ocupado (Firestore, un render pesado). */
  .view-track{display:flex;align-items:flex-start;width:300%;will-change:transform;}
  .view-page{width:calc(100%/3);min-width:0;flex-shrink:0;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .topbar .brand{order:1;}
  .topbar .topbar-actions{order:2;}
  .brand{display:flex;align-items:center;gap:2px;min-width:0;}
  .brand-mark{
    width:42px;height:42px;border-radius:11px;flex-shrink:0;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.14) 0 5px, transparent 5px 10px),
      linear-gradient(145deg,var(--navy),var(--sky));
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:25px;box-shadow:var(--shadow);
  }
  .brand-name{font-size:20px;font-weight:700;}
  /* Cuando este dispositivo está viendo el inventario compartido de otra cuenta (no
     el propio), se muestra de quién es — antes solo se veía adentro del panel de
     equipo, había que tocar el ícono de la nube para acordarte de qué cuenta estás
     mirando. */
  .account-owner-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--basil-ink);background:var(--basil-soft);border-radius:20px;padding:2px 10px 2px 8px;margin-top:3px;max-width:100%;box-sizing:border-box;overflow-wrap:anywhere;}
  .account-owner-pill svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

  /* Antes estos botones eran grises y solo se coloreaban con :hover — en el celular
     (donde vive casi todo el uso real) no hay hover, así que quedaban siempre
     grises, sin ninguna señal de qué son ni de que son tocables. Ahora cada uno
     tiene su propio tinte de fondo desde el principio (como los botones de barra de
     iOS/Android), y se oscurece un poco al tocar para dar respuesta táctil real —
     no un simple gris que cambia de color al pasar el mouse. */
  .lang-toggle{width:38px;height:38px;border-radius:50%;border:1px solid transparent;background:var(--bg);color:var(--ink-soft);font-size:11.5px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);flex-shrink:0;transition:transform .15s ease, filter .2s ease;}
  .lang-toggle:active{transform:scale(0.9);filter:brightness(0.96);}
  #btn-export-data, #btn-import-data, #btn-lang-toggle{background:var(--navy-wash);color:var(--navy);}
  #btn-feedback{background:var(--tomato-soft);color:var(--tomato);}
  #btn-alert-settings{background:var(--saffron-soft);color:var(--saffron-ink);}
  #btn-cloud-sync.synced{color:var(--basil);background:var(--basil-soft);}
  #btn-cloud-sync.loading{opacity:0.5;pointer-events:none;}
  #btn-cloud-sync.loading svg{animation:spin .8s linear infinite;}
  /* A diferencia de .loading (que además bloquea el toque), acá el botón sigue
     tocable a propósito — abrir el panel de equipo es exactamente lo que alguien
     quiere hacer si nota que la nube quedó "pendiente" un rato largo (ver
     cloudSyncDirty en el listener de Firestore). */
  #btn-cloud-sync.pending{color:var(--saffron-ink);background:var(--saffron-soft);}
  #btn-cloud-sync.pending svg{animation:spin 1.1s linear infinite;}
  /* Cuando no hay sesión, el botón de la nube se ve como un ícono chico más entre
     otros y pasa desapercibido — en ese estado se agranda a una píldora con texto
     para que sea obvio que ahí se crea una cuenta. */
  .cloud-signin-btn{height:38px;padding:0 16px 0 12px;border-radius:19px;border:none;background:var(--navy);color:#fff;font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:6px;cursor:pointer;flex-shrink:0;box-shadow:var(--shadow);transition:transform .2s ease, opacity .3s ease;font-family:'Inter';white-space:nowrap;}
  .cloud-signin-btn:active{transform:scale(0.95);}
  .cloud-signin-btn.loading{opacity:0.6;pointer-events:none;}
  .cloud-signin-btn.loading svg{animation:spin .8s linear infinite;}

  /* BOTTOM NAV */
  .bottom-nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(115deg,var(--navy),var(--sky));border-top:1px solid rgba(255,255,255,0.15);display:flex;z-index:40;box-shadow:0 -4px 18px rgba(232,86,44,0.3);padding-bottom:env(safe-area-inset-bottom);}
  .bottom-nav-item{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px 8px;color:rgba(255,255,255,0.65);font-size:10px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;position:relative;font-family:'Inter';transition:color .25s ease;}
  .bottom-nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .bottom-nav-item.active{color:#fff;}
  .bottom-nav-item.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:3px;border-radius:0 0 3px 3px;background:#DCF8C6;}
  .bottom-nav-item:active{transform:scale(0.95);}

  .scan-card{cursor:pointer;}
  .scan-fab-mini{width:52px;height:52px;flex-shrink:0;position:relative;transition:transform .25s ease;}
  .scan-fab-mini-lg{width:76px;height:76px;}
  .scan-card:hover .scan-fab-mini{transform:scale(1.07);}
  .scan-card:active .scan-fab-mini{transform:scale(0.94);}
  .scan-fab-mini svg{position:relative;z-index:2;width:100%;height:100%;filter:drop-shadow(0 2px 5px rgba(32,33,36,0.25));}
  .scan-fab-ring{
    position:absolute;inset:0;border-radius:50%;background:rgba(90,170,214,0.35);
    animation:fabPulse 1.8s cubic-bezier(0.3,0.6,0.4,1) infinite; z-index:1;
  }
  .scan-fab-ring.delay{animation-delay:.6s;}
  @keyframes fabPulse{
    0%{transform:scale(1);opacity:.65;}
    100%{transform:scale(1.9);opacity:0;}
  }

  .grid-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:24px;}
  .stat-card{background:var(--panel);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border:1px solid var(--line);}
  .stat-label{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
  .stat-value{font-size:26px;font-weight:700;margin-top:6px;font-family:'Space Grotesk';}
  .stat-value.saffron{color:var(--saffron);}

  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .section-head h2{font-size:18px;margin:0;}
  .section-head p{font-size:13px;color:var(--ink-soft);margin:2px 0 0;}

  .btn{border:none;border-radius:10px;padding:10px 16px;font-weight:600;font-size:13.5px;cursor:pointer;transition:transform .2s var(--ease-soft), filter .2s var(--ease-soft), opacity .3s ease, background .3s ease;font-family:'Inter';}
  .btn:active{transform:scale(0.97);filter:brightness(0.96);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-primary{background:var(--saffron);color:var(--ink);}
  .btn-primary:hover{background:var(--saffron-press);}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--navy);}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:8px;}
  .btn-icon{display:inline-flex;align-items:center;gap:7px;position:relative;}
  .btn-icon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  /* Los 3 botones completos (con su texto, no solo un ícono) en una sola fila —
     "Nuevo producto" primero, después conteo cíclico y cambios. Se reparten el
     ancho por igual (flex:1) y el texto se achica un poco en vez de desbordar,
     así entran los 3 hasta en un celular angosto sin pasar a una segunda línea. */
  .inv-header-actions{display:flex;gap:6px;flex-wrap:nowrap;align-items:stretch;}
  .inv-row-btn{position:relative;flex:1;min-width:0;text-align:center;white-space:normal;line-height:1.2;padding:9px 6px;font-size:12.5px;}

  .alert-banner{background:var(--tomato-soft);border:1px solid #F2C6C8;border-radius:12px;padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:10px;color:var(--tomato-ink);font-size:13.5px;font-weight:600;transition:transform .12s ease;}
  #cc-banner:active{transform:scale(0.98);}
  .alert-banner .count{background:var(--tomato);color:#fff;border-radius:20px;padding:2px 9px;font-size:12px;}

  .mono-cell{font-family:'IBM Plex Mono';}

  .price-updated{display:inline-block;background:var(--basil-soft);color:var(--basil);font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px;}

  .link-btn{background:none;border:none;color:var(--navy);font-weight:600;font-size:12.5px;cursor:pointer;padding:4px 6px;transition:opacity .15s ease;}
  .link-btn:hover{text-decoration:underline;}
  .link-btn:active{opacity:.5;}


  /* STOCK ANALYTICS CARD */
  .stock-card{background:var(--panel);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);padding:20px 20px 0;margin-bottom:24px;}
  /* Encabezado de cada grupo de categoría en Inventario — solo aparece cuando hay
     2+ grupos con productos, para no meter un título de más cuando total no aporta nada. */
  .category-group-header{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px 4px;}
  .category-group-header span{background:var(--line);color:var(--ink-soft);border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700;}
  /* Botones de categoría del Dashboard — fila horizontal con scroll propio, no se
     envuelve en varias líneas ni empuja el resto de la pantalla hacia abajo. */
  .category-chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:16px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .category-chip-row::-webkit-scrollbar{display:none;}
  .category-chip{flex-shrink:0;display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:9px 8px 9px 16px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .12s ease;white-space:nowrap;}
  /* Mantener presionado un chip y arrastrarlo reordena la fila en el lugar — ver
     attachCategoryChipDragHandlers(). Mientras se arrastra, se le saca la transición
     de transform (si no, cada micro-ajuste de re-base al cruzar un vecino se ve como
     un rebote elástico en vez de seguir el dedo 1 a 1, el mismo motivo por el que
     .view-track apaga su transition mientras el swipe de pestañas está en curso). */
  .category-chip.dragging{transition:none;box-shadow:var(--shadow-lg);opacity:.97;cursor:grabbing;}
  .category-chip-row.reordering{touch-action:none;}
  .category-chip:active{transform:scale(0.96);}
  .category-chip span{background:var(--navy-wash);color:var(--navy-ink);border-radius:10px;min-width:20px;text-align:center;padding:2px 7px;font-size:11.5px;font-weight:700;}

  /* Modal de gestión de categorías — cada fila es una "tarjeta" con una burbuja de
     color (rotando por una paleta, solo decorativo, sin significado semántico como
     en el resto de la app) en vez de un renglón de formulario plano. */
  .category-edit-row{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:16px;padding:6px 8px 6px 6px;transition:background .15s ease, box-shadow .15s ease;}
  .category-edit-row:focus-within{background:#fff;box-shadow:0 0 0 2px var(--line);}
  .category-edit-row.add-row{background:transparent;border:2px dashed var(--line);}
  .cat-bubble{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;font-family:'Space Grotesk';}
  .category-edit-row input{flex:1;min-width:0;border:none;background:transparent;font-size:15px;font-weight:700;padding:11px 6px;color:var(--ink);outline:none;font-family:'Inter';}
  .category-edit-row input::placeholder{font-weight:600;color:var(--ink-soft);}
  /* Reordenar categorías es presionar y arrastrar la fila (no la fila entera: el input
     y la x quedan afuera del gesto, ver attachEvents) — mismo truco de long-press +
     reinserción en vivo en el DOM que ya usan los chips de categoría del Dashboard
     (attachCategoryChipDragHandlers), solo que en el eje vertical. El orden acá es el
     mismo en el que van a aparecer de izquierda a derecha en esa fila de chips, así que
     "arriba" en esta lista vertical mueve un puesto hacia la izquierda allá. */
  .category-edit-row[data-cat-id]{cursor:grab;}
  .category-edit-row.dragging{transition:none;box-shadow:var(--shadow-lg);background:#fff;opacity:.97;cursor:grabbing;}
  .category-edit-list.reordering{touch-action:none;}
  .stock-card-title{font-size:15px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;font-family:'Space Grotesk';margin:0 0 6px;}
  /* Todas las filas de inventario (Dashboard e Inventario) usan esta misma clase — ya
     no hay gesto de deslizar para borrar en ninguna de las dos, se borra con la x
     chica (.stock-row-x-btn) para no competir con el deslizar entre pestañas. */
  .stock-row-static{border-bottom:1px solid var(--line);}
  .stock-row-static:last-child{border-bottom:none;}
  .stock-row-x-btn{width:26px;height:26px;border-radius:50%;border:none;background:var(--bg);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:12px;line-height:1;padding:0;transition:background .15s ease,color .15s ease,transform .1s ease;}
  .stock-row-x-btn:active{transform:scale(0.88);background:var(--tomato-soft);color:var(--tomato-ink);}
  /* padding horizontal (no solo vertical) — sin esto, el ícono/nombre/botones quedan
     pegados exactamente al mismo borde donde .cc-due-blink dibuja su anillo rojo
     (ver más abajo), así que el botón de editar terminaba tapado a medias por esa
     línea en vez de tener aire respecto a ella. */
  .stock-row{display:flex;align-items:center;gap:16px;padding:16px 10px;background:var(--panel);position:relative;}
  .stock-icon-ring{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:2px solid var(--stock-ok);background:#fff;overflow:hidden;transition:transform .12s ease;}
  .stock-icon-ring[data-photo-item]:active{transform:scale(0.9);}
  .stock-icon-ring svg{width:30px;height:30px;display:block;filter:drop-shadow(0 1px 1.5px rgba(28,30,33,0.18));}
  .stock-icon-ring img{width:100%;height:100%;object-fit:cover;display:block;}
  .stock-icon-ring.warn{border-color:var(--stock-warn);}
  .stock-icon-ring.crit{border-color:var(--stock-crit);}
  .stock-icon-ring.none{border-color:#C7CAD1;}
  .stock-main{flex:1;min-width:0;}
  /* overflow-wrap:anywhere — nombres de producto sin espacios (SKUs, nombres pegados)
     se salían de .stock-main y quedaban flotando encima de los botones de
     editar/borrar en vez de cortar la línea. min-width:0 en .stock-main (flexbox)
     no alcanza para esto: evita que el ITEM empuje el ancho del row, pero no evita
     que el TEXTO adentro se desborde visualmente si no hay dónde partir la palabra. */
  .stock-name{font-size:12.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;margin-bottom:6px;overflow-wrap:anywhere;}
  .stock-bar-track{background:#E9EAEC;border-radius:20px;height:20px;overflow:hidden;position:relative;}
  .stock-bar-fill{height:100%;border-radius:20px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;min-width:34px;transition:width .4s ease;}
  .stock-bar-fill span{color:#fff;font-size:10.5px;font-weight:700;font-family:'IBM Plex Mono';white-space:nowrap;}
  .stock-bar-fill.ok{background:var(--stock-ok);}
  .stock-bar-fill.warn{background:var(--stock-warn);}
  .stock-bar-fill.crit{background:var(--stock-crit);}

  /* Barra de presupuesto — versión angosta de .stock-bar-track/.stock-bar-fill,
     sin el badge de texto adentro (acá el número va afuera, en su propia línea). */
  .budget-bar-track{background:#E9EAEC;border-radius:20px;height:7px;overflow:hidden;margin-top:10px;}
  .budget-bar-fill{height:100%;border-radius:20px;transition:width .4s ease;}
  .budget-bar-fill.ok{background:var(--stock-ok);}
  .budget-bar-fill.warn{background:var(--stock-warn);}
  .budget-bar-fill.crit{background:var(--stock-crit);}
  .budget-bar-fill.none{background:var(--line);}
  .stock-caption{font-size:11px;color:var(--ink-soft);margin-top:5px;}
  .stock-caption-muted{font-style:italic;}
  .stock-actions{flex-shrink:0;text-align:center;}
  .stock-actions-btns{display:flex;gap:6px;}
  .stock-icon-btn{width:30px;height:30px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;color:#fff;transition:transform .2s ease;}
  .stock-icon-btn:active{transform:scale(0.9);}
  .stock-icon-btn svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .stock-icon-btn.edit{background:var(--navy);}
  .inv-row-meta{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:2px;}
  .stock-summary{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 0 20px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap;}
  .stock-summary-label{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;font-weight:600;}
  .stock-summary-value{font-size:20px;font-weight:700;color:var(--stock-crit);font-family:'Space Grotesk';margin-top:2px;}
  .stock-summary-right{text-align:right;}
  .stock-suggest-btn{background:var(--stock-ok);color:#fff;border:none;border-radius:20px;padding:9px 18px;font-size:12px;font-weight:700;margin-top:4px;cursor:pointer;transition:transform .15s ease,filter .15s ease;}
  .stock-suggest-btn:hover{opacity:.9;}
  .stock-suggest-btn:active{transform:scale(0.96);filter:brightness(0.94);}
  .cc-due-dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--tomato);border:2px solid var(--panel);}
  /* Resalta con un parpadeo rojo claro los productos que le tocan en la tanda actual
     de conteo cíclico — igual en Dashboard e Inventario. Antes esto era solo un borde
     interior de 2px cambiando de opacidad — casi invisible a simple vista en un
     celular, mirando una lista. Ahora también pulsa un tinte de fondo (mismo rojo)
     para que el movimiento se note sin tener que fijarse en el borde. */
  @keyframes cc-due-pulse{
    0%, 100%{box-shadow:inset 0 0 0 2px rgba(229,72,77,0.3); background:rgba(229,72,77,0.05);}
    50%{box-shadow:inset 0 0 0 2px rgba(229,72,77,0.85); background:rgba(229,72,77,0.14);}
  }
  /* La animación va en .stock-row (el hijo), no en .stock-row-static (el padre):
     .stock-row tiene su propio background:var(--panel) opaco que, al pintarse
     encima, tapaba por completo el parpadeo del padre — la animación corría (se
     podía confirmar por getComputedStyle) pero nunca se veía en pantalla. */
  .stock-row-static.cc-due-blink .stock-row{animation:cc-due-pulse 1.6s ease-in-out infinite;border-radius:10px;}
  @media (prefers-reduced-motion: reduce){
    .stock-row-static.cc-due-blink .stock-row{animation:none;box-shadow:inset 0 0 0 2px rgba(229,72,77,0.5);background:rgba(229,72,77,0.08);}
  }
  /* Igual que cc-due-blink pero disparado a mano al tocar "Alertas críticas" — dos
     pulsos y se apaga solo (ver btn-critical-alerts en attachEvents), en vez de
     quedar prendido todo el tiempo como cc-due-blink. */
  .stock-row-static.crit-flash .stock-row{animation:cc-due-pulse 1.2s ease-in-out 2;border-radius:10px;}
  @media (prefers-reduced-motion: reduce){
    .stock-row-static.crit-flash .stock-row{animation:none;box-shadow:inset 0 0 0 2px rgba(229,72,77,0.5);background:rgba(229,72,77,0.08);}
  }

  /* Tarjetas de recibos (grid con foto de portada), pestaña Recibos */
  .dish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  .dish-card{background:var(--panel);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:transform .12s ease;}
  .dish-card:active{transform:scale(0.98);}

  .cal-widget{background:var(--panel);border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;}
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  /* Antes era texto pelado sin fondo ni borde — nada avisaba que se podía tocar para
     cambiar entre la vista de mes y la de año completo. Ahora tiene la forma de un
     botón de verdad (fondo, esquinas redondeadas, una flechita que indica que se
     despliega), en vez de depender de un cambio de color al pasar el mouse. */
  .cal-month-label{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:15px;text-transform:capitalize;background:var(--navy-wash);border:none;color:var(--navy);font-family:'Inter';cursor:pointer;padding:8px 14px;border-radius:10px;transition:filter .2s ease, transform .15s ease;}
  .cal-month-label svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .cal-month-label:active{transform:scale(0.96);filter:brightness(0.97);}
  .cal-year-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .cal-year-month{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 5px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-family:'Inter';cursor:pointer;transition:transform .2s ease,border-color .2s ease;}
  .cal-year-month:hover{border-color:var(--navy);}
  .cal-year-month:active{transform:scale(0.96);}
  .cal-year-month.current{background:#fff;box-shadow:inset 0 0 0 2px var(--navy);}
  .mini-cal-title{font-size:10.5px;font-weight:700;color:var(--ink);text-transform:capitalize;}
  .mini-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;width:100%;}
  .mini-cal-day{font-size:6.5px;line-height:9px;text-align:center;color:var(--ink-soft);aspect-ratio:1;}
  .mini-cal-day.has-receipt{background:var(--saffron);color:#fff;border-radius:50%;font-weight:700;}
  .mini-cal-day.today{box-shadow:inset 0 0 0 1px var(--tomato);border-radius:50%;}
  .cal-nav-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-size:18px;line-height:1;cursor:pointer;transition:transform .2s ease,border-color .2s ease,color .2s ease;}
  .cal-nav-btn:hover{border-color:var(--navy);color:var(--navy);}
  .cal-nav-btn:active{transform:scale(0.92);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
  .cal-grid.cal-weekdays{margin-bottom:8px;}
  .cal-weekday{text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;padding:2px 0;}
  .cal-day{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--bg);}
  .cal-day.empty{background:none;}
  .cal-day.today{box-shadow:inset 0 0 0 2px var(--saffron);}
  .cal-day.blink{animation:calBlink 1s ease-in-out infinite;}
  @keyframes calBlink{
    0%,100%{box-shadow:inset 0 0 0 2px var(--tomato);}
    50%{box-shadow:inset 0 0 0 2px transparent;}
  }
  .cal-day img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .cal-day-num{position:relative;font-size:13px;font-weight:600;color:var(--ink-soft);}
  .cal-day-receipt-icon{position:relative;display:flex;color:var(--saffron-ink);}
  .cal-day.has-receipt{cursor:pointer;transition:transform .2s ease;}
  .cal-day.has-receipt:hover{transform:scale(1.06);}
  .cal-day.has-receipt:active{transform:scale(0.94);}
  .cal-day-badge{position:absolute;top:2px;right:2px;background:var(--tomato);color:#fff;font-size:9px;font-weight:700;line-height:1;padding:2px 4px;border-radius:8px;}
  .day-receipt-row{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:8px;cursor:pointer;transition:background .2s ease,transform .12s ease;}
  .day-receipt-row:hover{background:#E7E9EC;}
  .day-receipt-row:active{transform:scale(0.98);background:#E7E9EC;}
  .day-receipt-thumb{width:40px;height:40px;border-radius:8px;overflow:hidden;flex-shrink:0;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .day-receipt-thumb img{width:100%;height:100%;object-fit:cover;}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(28,30,33,0.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:overlayFadeIn .4s ease;}
  /* Se "despliega" desde arriba hacia abajo (transform-origin:top + scaleY) en vez de
     escalar parejo desde el centro — se siente como que el cuadrito se abre hacia
     abajo (piensa en un ajuste rápido, o el modal de configuración), consistente en
     todas las ventanas emergentes de la app, sean grandes o chicas. */
  .modal{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:460px;box-shadow:var(--shadow-lg);max-height:88vh;overflow-y:auto;transform-origin:top center;animation:modalPopIn .65s var(--ease-spring);}
  @keyframes overlayFadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes modalPopIn{
    from{opacity:0;transform:scaleY(0.82) scaleX(0.96) translateY(-10px);}
    60%{opacity:1;}
    to{opacity:1;transform:scaleY(1) scaleX(1) translateY(0);}
  }
  .modal.wide{max-width:600px;}
  /* Botón de cerrar (X) para modales largos que se scrollean (ej. Configuración) —
     position:sticky lo deja pegado arriba a la derecha del modal aunque el usuario
     esté scrolleado en el medio, en vez de obligarlo a llegar hasta "Cancelar" al
     final para poder salir. */
  .modal-close-btn{position:sticky;top:0;float:right;margin:-16px -8px 0 12px;width:30px;height:30px;border-radius:50%;border:none;background:var(--bg);color:var(--ink-soft);font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;transition:background .15s ease,transform .1s ease;}
  .modal-close-btn:active{transform:scale(0.9);}
  .modal h3{margin:0 0 4px;font-size:18px;}
  /* Antes todos los títulos de modal eran del mismo negro parejo que el resto del
     texto — nada distinguía a simple vista un modal de alertas de uno de compartir
     inventario. Cada modal ahora usa uno de los 4 colores que la app ya usa en otros
     lados (verde marca, verde brillante, ámbar, rojo), agrupados por lo que
     representan: informativo, positivo/compartir, alerta, o reportar un problema. */
  .modal h3.navy{color:var(--navy);}
  .modal h3.basil{color:var(--basil-ink);}
  .modal h3.saffron{color:var(--saffron-ink);}
  .modal h3.tomato{color:var(--tomato);}
  .modal h3.sky{color:var(--sky-ink);}

  /* Fila del historial de actividad — quién, qué y cuándo, una línea liviana por
     cambio (no una tarjeta pesada, puede haber muchas). */
  .activity-row{display:flex;align-items:baseline;gap:6px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap;}
  .activity-row:last-child{border-bottom:none;}
  .activity-row-by{font-weight:700;color:var(--ink);flex-shrink:0;}
  .activity-row-what{color:var(--ink-soft);flex:1;min-width:120px;}
  .activity-row-when{color:var(--ink-soft);font-size:11.5px;flex-shrink:0;}

  /* Cotegito de "no leído" (como el de mensajes) — un número en rojo sobre el botón
     que abre el historial, para que se note sin tener que entrar a mirar. */
  .count-badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:10px;background:var(--tomato);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 0 0 2px #fff;}

  .modal .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:'Inter';background:#FAFAF9;}
  .field input:focus,.field select:focus{outline:2px solid var(--navy-soft);border-color:var(--navy);background:#fff;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .modal-actions .btn{flex:1;}
  .helper-note{font-size:11.5px;color:var(--ink-soft);margin-top:-8px;margin-bottom:14px;}
  .status-pill-success{display:inline-flex;align-items:center;gap:6px;background:var(--basil-soft);color:var(--basil-ink);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:20px;margin-bottom:18px;}

  /* Tutorial de bienvenida: un paso a la vez, con un color lleno de fondo (no solo
     el ícono) para que avanzar se sienta como pasar de página. render() reconstruye
     el modal entero en cada paso, así que la animación de entrada se vuelve a
     disparar sola cada vez — no hace falta ningún truco de "key" en JS.
     cursor:grab avisa que también se puede deslizar el dedo (o arrastrar con el
     mouse) para cambiar de paso, no solo tocar los botones (ver attachEvents). */
  .welcome-step-card{border-radius:14px;padding:26px 20px;text-align:center;margin:16px 0;animation:welcomeStepInFwd .4s var(--ease-soft);cursor:grab;touch-action:pan-y;}
  .welcome-step-card:active{cursor:grabbing;}
  .welcome-step-card.dir-back{animation-name:welcomeStepInBack;}
  .welcome-step-icon{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;color:#fff;margin-bottom:14px;box-shadow:var(--shadow);}
  .welcome-step-title{display:block;font-size:16px;margin-bottom:6px;}
  .welcome-step-sub{font-size:13px;color:var(--ink-soft);line-height:1.45;}
  /* Entra deslizando desde el lado del que "viene" (derecha al avanzar, izquierda al
     retroceder o saltar hacia atrás con los puntitos) en vez de solo aparecer — se
     siente como pasar páginas de verdad, no como un cambio de contenido genérico. */
  @keyframes welcomeStepInFwd{
    from{opacity:0;transform:translateX(22px) scale(0.98);}
    to{opacity:1;transform:translateX(0) scale(1);}
  }
  @keyframes welcomeStepInBack{
    from{opacity:0;transform:translateX(-22px) scale(0.98);}
    to{opacity:1;transform:translateX(0) scale(1);}
  }
  .welcome-dots{display:flex;justify-content:center;gap:9px;margin-bottom:4px;}
  .welcome-dot{width:7px;height:7px;border-radius:50%;cursor:pointer;padding:6px;margin:-6px;background-clip:content-box;transition:transform .25s ease,background .25s ease;}
  .welcome-dot.active{transform:scale(1.35);}
  /* Link de "Saltar" arriba a la derecha del modal, mismo patrón sticky+float que
     .modal-close-btn (funciona sin position:relative porque .modal ya scrollea) —
     visible en todos los pasos salvo el último, que ya tiene su propio botón de salida. */
  .welcome-skip-btn{position:sticky;top:0;float:right;margin:-6px -6px 0 12px;background:none;border:none;color:var(--ink-soft);font-size:12.5px;font-weight:600;cursor:pointer;padding:5px 8px;border-radius:8px;transition:background .15s ease,transform .1s ease;}
  .welcome-skip-btn:active{transform:scale(0.94);background:var(--bg);}
  /* Corta cualquier animation: de entrada — se usa en redibujados de fondo que NO
     son un cambio real de pantalla (ver welcomeStepAnimated), para que no "parpadeen". */
  .no-anim{animation:none !important;}
  .settings-card{background:#F7F7F5;border-radius:12px;padding:16px;margin-bottom:14px;}
  .settings-card .helper-note{margin-top:8px;}

  .ing-list-mini{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:180px;overflow-y:auto;}
  .ing-list-mini-item{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:8px 10px;background:#FAFAF7;border-radius:8px;}
  .remove-x{background:none;border:none;color:var(--tomato);cursor:pointer;font-size:15px;padding:0 4px;transition:transform .12s ease,opacity .12s ease;}
  .remove-x:active{transform:scale(0.85);opacity:.6;}
  [data-remove-scan-page]{transition:transform .12s ease;}
  [data-remove-scan-page]:active{transform:scale(0.85);}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty-state .em-icon-badge{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}

  /* DASHBOARD — primeros pasos (inventario todavía vacío). Mismo degradé navy→basil
     que .brand-mark/.scan-fab-mini (para que se sienta parte de la misma marca, no un
     componente aparte) con una respiración suave (dash-empty-breathe) para que la
     pantalla de "no tenés nada todavía" se sienta viva en vez de un cartel estático.
     La tarjeta entera entra con dash-empty-in — sutil, una sola vez, no se repite. */
  .dash-empty-card{background:var(--panel);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);padding:36px 24px;margin-bottom:24px;text-align:center;animation:dash-empty-in .55s cubic-bezier(0.16,1,0.3,1);}
  .dash-empty-badge{
    width:64px;height:64px;margin:0 auto 16px;border-radius:18px;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.14) 0 5px, transparent 5px 10px),
      linear-gradient(145deg,var(--navy),var(--sky));
    display:flex;align-items:center;justify-content:center;color:#fff;
    box-shadow:0 6px 18px rgba(232,86,44,0.35);
    animation:dash-empty-breathe 2.6s ease-in-out infinite;
  }
  .dash-empty-badge svg{stroke-width:1.6;}
  .dash-empty-card h3{margin:0 0 6px;font-size:17px;}
  .dash-empty-card p{margin:0 auto 20px;font-size:13.5px;color:var(--ink-soft);max-width:320px;line-height:1.5;}
  .dash-empty-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  @keyframes dash-empty-breathe{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.08);}
  }

let purchases = [];

   o se borró justo antes de que llegara el primer snapshot en tiempo real), la nube

   se hubiera borrado. Ahora, cada vez que se conecta la nube (ver reconcileLocalOnlyData),
   se borra explícitamente de la nube cualquier id que esté acá, ANTES de que los listeners
   en tiempo real puedan traerlo de vuelta — y un snapshot que igual llegue con uno de estos

let deletedInventoryIds = [];

// el otro dispositivo lo veía como "dato local que la nube todavía no tiene" y lo re-subía
// (ver reconcileLocalOnlyData/missingRec), con las fotos apuntando a archivos de Storage ya
// borrados. Se propaga por el mismo canal (dentro de meta) y se filtra en los snapshots.
let deletedReceiptIds = [];
let deletedPurchaseIds = [];
// Nota: recibos guardados antes de la migración a Claude API pueden tener el formato viejo

// abajo soporta ambos formatos en vez de asumir que todos los recibos ya son el nuevo.
let aliasMap = {}; // nombre normalizado del recibo -> ingredienteId, aprendido de correcciones previas
let receiptSearchQuery = '';
try{ receiptSearchQuery = localStorage.getItem('patron_receipt_search') || ''; }catch(e){}

let calendarViewMonth = null;
try{ calendarViewMonth = localStorage.getItem('patron_cal_month') || null; }catch(e){}
let showDayReceipts = null; // "YYYY-MM-DD" del día tocado en el calendario cuando tiene más de un recibo, o null
let calendarShowYearPicker = false; // true cuando se tocó el mes/año arriba del calendario, para elegir otro mes del mismo año de un tirón
let calendarAmountQuery = ''; // texto del buscador por monto, al lado de "Escanear recibo"
let calendarBlinkDates = []; // fechas "YYYY-MM-DD" que coinciden con calendarAmountQuery — esos días parpadean en el calendario

// Antes esto siempre arrancaba en 'dashboard', así que refrescar la página (o cerrar y
// volver a abrir la app) te sacaba de la pestaña en la que estabas — ahora se recuerda
// la última pestaña usada en este dispositivo.
let activeTab = 'dashboard';
try{ activeTab = localStorage.getItem('patron_active_tab') || 'dashboard'; }catch(e){}
const TAB_ORDER = ['dashboard','inventario','recibos'];
let showItemModal=false, showScanModal=false, showReceiptDetail=null, showWelcomeModal=false, showLangChoiceModal=false;
// Qué paso del tutorial de bienvenida se está mostrando (ver welcomeModal()).
let welcomeStep = 0;
// Dirección del último cambio de paso (1 = avanzando, -1 = retrocediendo) — decide si
// el paso entra deslizando desde la derecha o desde la izquierda (ver welcomeModal()),
// para que saltar directo a un punto con los puntitos también se sienta direccional

let welcomeStepDir = 1;
// Punto X donde empezó el toque actual sobre la tarjeta del paso, o null si no hay

let welcomeSwipeStartX = null;
// Si el paso actual ya se terminó de animar una vez. render() reconstruye TODA la
// pantalla de cero ante cualquier cosa (ej. la reconexión a la nube que arranca sola
// en segundo plano si ya iniciaste sesión antes) — sin esto, cada uno de esos
// redibujados de fondo, aunque no cambien nada visible del tutorial, vuelve a
// disparar sus animaciones de entrada (fade del fondo + pop del modal + del paso),
