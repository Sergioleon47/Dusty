<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Página PÚBLICA del catálogo de un negocio (compartida por WhatsApp/QR a sus
     clientes): sin cuenta, sin app, sin nada de Dusty cargado — solo lee
     get-catalog por el id de la URL (?c=...) y arma la grilla. Todo texto entra
     por textContent (nunca innerHTML con datos), los nombres los escriben los
     dueños de los negocios. noindex: el link es la llave, no debe indexarse. -->
<meta name="robots" content="noindex">
<title>Catálogo</title>
<!-- Identidad al COMPARTIR el link (pedido del usuario 2026-09-06: la tarjeta de
     compartir mostraba los colores viejos): favicon e ícono de Apple con la marca
     naranja vigente, y theme-color acorde a la paleta clara/oscura de ESTA página.
     Sin og:image a propósito — la tarjeta es del negocio, no de Dusty. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%23ff6b35'/%3E%3Ctext x='24' y='34' font-family='Arial, sans-serif' font-weight='700' font-size='28' fill='white' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf7f2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171411">
<meta property="og:title" content="Catálogo">
<meta property="og:description" content="Mirá los productos y hacé tu pedido.">
<style>
  :root{
    --bg:#faf7f2; --panel:#ffffff; --ink:#26221c; --ink-soft:#8a8378;
    --line:#ece6dc; --accent:#2f7d4f; --accent-soft:#e7f3ec; --wa:#25d366;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#171411; --panel:#221e19; --ink:#f0ebe2; --ink-soft:#9a9184;
      --line:#332e27; --accent:#6fbf8f; --accent-soft:#20301f; }
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;padding-bottom:40px;}
  header{padding:26px 18px 14px;text-align:center;}
  header h1{font-size:22px;font-weight:800;overflow-wrap:anywhere;}
  header .sub{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .status{text-align:center;padding:60px 24px;color:var(--ink-soft);font-size:14px;}
  .cat-header{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-soft);padding:18px 18px 8px;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 14px;}
  @media(min-width:640px){ .grid{grid-template-columns:repeat(3,1fr);max-width:760px;margin:0 auto;} }
  /* Solo la FOTO, semi-cuadrada (esquinas redondeadas) — la descripción vive en
     la ficha que se abre al tocar. Sin foto, el nombre centrado hace de imagen
     (si no, el producto sería un cuadrado mudo imposible de identificar). */
  .card{aspect-ratio:1/1;background:var(--accent-soft);border:1px solid var(--line);
    border-radius:18px;overflow:hidden;cursor:pointer;position:relative;padding:0;}
  .card img{width:100%;height:100%;object-fit:cover;display:block;}
  .card .noph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    padding:12px;font-size:14px;font-weight:800;text-align:center;color:var(--ink);
    overflow-wrap:anywhere;}
  .card:active{transform:scale(.97);}
  /* Ficha del producto: hoja desde abajo con foto grande, nombre, precio y Pedir. */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;
    justify-content:center;z-index:10;}
  .sheet{background:var(--panel);width:100%;max-width:480px;border-radius:20px 20px 0 0;
    overflow:hidden;animation:up .22s ease-out;}
  @keyframes up{from{transform:translateY(40px);opacity:.4;}to{transform:none;opacity:1;}}
  /* La ficha muestra la imagen COMPLETA (contain, sin recortar) — pedido del
     usuario 2026-09-06; tocarla la abre a pantalla completa. */
  .sheet .big{width:100%;max-height:58vh;object-fit:contain;display:block;
    background:var(--accent-soft);cursor:zoom-in;}
  .fsview{position:fixed;inset:0;background:rgba(0,0,0,.93);display:flex;align-items:center;
    justify-content:center;z-index:30;cursor:zoom-out;}
  .fsview img{max-width:100vw;max-height:100vh;object-fit:contain;}
  .sheet .bignoph{width:100%;height:160px;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);font-size:44px;}
  .sheet .body{padding:16px 18px calc(18px + env(safe-area-inset-bottom));}
  .sheet .name{font-size:17px;font-weight:800;overflow-wrap:anywhere;}
  .sheet .price{font-size:19px;font-weight:800;color:var(--accent);margin-top:4px;
    font-variant-numeric:tabular-nums;}
  .sheet .price small{font-size:12px;font-weight:600;color:var(--ink-soft);}
  .sheet .ask{font-size:13.5px;font-weight:700;color:var(--ink-soft);margin-top:4px;}
  .sheet .close{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;
    border:none;background:rgba(0,0,0,.45);color:#fff;font-size:16px;cursor:pointer;z-index:11;}
  .wa-btn{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--wa);
    color:#fff;border:none;border-radius:12px;padding:12px 10px;font-size:14px;font-weight:800;
    cursor:pointer;text-decoration:none;margin-top:14px;}
  footer{text-align:center;padding:34px 16px 10px;font-size:11.5px;color:var(--ink-soft);}
  footer a{color:var(--ink-soft);}
  /* Compartir el catálogo (para el CLIENTE que lo está viendo): abre el menú de
     compartir del teléfono — SMS, Facebook, Instagram, TikTok, lo que tenga. */
  .share-fab{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;width:40px;height:40px;
    border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;
    box-shadow:0 2px 10px rgba(0,0,0,.12);}
  .share-toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;
    transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;
    padding:9px 16px;border-radius:20px;z-index:20;}
</style>
</head>
<body>
<header id="hdr" hidden>
  <h1 id="biz"></h1>
  <div class="sub" id="sub"></div>
</header>
<div class="status" id="status">…</div>
<div id="content"></div>
<footer id="foot" hidden></footer>
<script>
(function(){
  // El id llega como ?c=... (link directo a catalogo.html) o en el path /c/<id>
  // (el rewrite de Netlify sirve esta página pero el navegador conserva la URL
  // bonita, así que el query interno del rewrite nunca se ve desde acá).
  var qs = new URLSearchParams(location.search);
  var id = (qs.get('c')||'').trim();
  if(!id){
    var m = location.pathname.match(/^\/c\/([A-Za-z0-9_-]+)/);
    if(m) id = m[1];
  }
  var statusEl = document.getElementById('status');

  function run(cat){
    var es = cat.lang !== 'en';
    var T = es
      ? {sub:'Catálogo de productos', order:'Pedir', consult:'Consultar precio',
         msg:'Hola! Vi tu catálogo y quiero pedir: ', foot:'Catálogo hecho con Dusty',
         empty:'Este catálogo no tiene productos todavía.',
         share:'Compartir este catálogo', copied:'Link copiado', sms:'SMS', call:'Llamar'}
      : {sub:'Product catalog', order:'Order', consult:'Ask for price',
         msg:'Hi! I saw your catalog and I want to order: ', foot:'Catalog made with Dusty',
         empty:'This catalog has no products yet.',
         share:'Share this catalog', copied:'Link copied', sms:'Text', call:'Call'};

    // Botón de compartir para el propio cliente: navigator.share abre el menú
    // nativo con TODAS sus apps (SMS, Facebook, Instagram, TikTok, Snapchat…);
    // donde no exista (escritorio viejo), copia el link al portapapeles.
    var shareBtn = document.createElement('button');
    shareBtn.className='share-fab'; shareBtn.type='button';
    shareBtn.setAttribute('aria-label', T.share); shareBtn.title = T.share;
    shareBtn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/></svg>';
    shareBtn.onclick = function(){
      var shareData = { title: cat.businessName || T.sub, url: location.href };
      if(navigator.share){ navigator.share(shareData).catch(function(){}); return; }
      var done = function(){ var tst=document.createElement('div'); tst.className='share-toast'; tst.textContent=T.copied; document.body.appendChild(tst); setTimeout(function(){ tst.remove(); }, 1800); };
      var manual = function(){ try{ prompt('', location.href); }catch(e){} };
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(location.href).then(done).catch(manual); }
      else { manual(); }
    };
    document.body.appendChild(shareBtn);

    document.title = cat.businessName ? cat.businessName + ' — ' + T.sub : T.sub;
    document.getElementById('biz').textContent = cat.businessName || T.sub;
    document.getElementById('sub').textContent = cat.businessName ? T.sub : '';
    document.getElementById('hdr').hidden = false;
    var foot = document.getElementById('foot');
    foot.textContent = T.foot; foot.hidden = false;

    var items = cat.items || [];
    if(items.length===0){ statusEl.textContent = T.empty; return; }
    statusEl.remove();

    // Agrupado por categoría (las sin categoría al final, sin encabezado si es la única).
    var groups = {}, order = [];
    items.forEach(function(it){
      var g = it.category || '';
      if(!(g in groups)){ groups[g] = []; order.push(g); }
      groups[g].push(it);
    });
    order.sort(function(a,b){ return (a==='')-(b==='') || a.localeCompare(b); });

    var content = document.getElementById('content');
    var waDigits = (cat.whatsapp||'').replace(/\D/g,'');
    var okPhoto = function(u){ return u && /^https:\/\/(firebasestorage\.googleapis\.com|storage\.googleapis\.com)\//.test(u); };

    // Ficha del producto (nombre, precio, Pedir) — se abre al tocar la foto y se
    // cierra tocando afuera o la ✕. Todo con textContent: los nombres los
    // escriben los negocios, nunca van como HTML.
    function openDetail(it){
      var ov = document.createElement('div'); ov.className='ov';
      var sheet = document.createElement('div'); sheet.className='sheet'; sheet.style.position='relative';
      var close = document.createElement('button'); close.className='close'; close.textContent='✕';
      close.setAttribute('aria-label','✕');
      sheet.appendChild(close);
      if(okPhoto(it.photoUrl)){
        var big = document.createElement('img'); big.className='big'; big.alt=it.name||''; big.src=it.photoUrl;
        big.onerror=function(){ var f=document.createElement('div'); f.className='bignoph'; f.textContent='🛍️'; big.replaceWith(f); };
        // Pantalla completa al tocar la foto — se cierra tocando en cualquier lado.
        big.onclick=function(){
          var fs=document.createElement('div'); fs.className='fsview';
          var fi=document.createElement('img'); fi.src=it.photoUrl; fi.alt=it.name||'';
          fs.appendChild(fi);
          fs.onclick=function(){ fs.remove(); };
          document.body.appendChild(fs);
        };
        sheet.appendChild(big);
      } else {
        var f0=document.createElement('div'); f0.className='bignoph'; f0.textContent='🛍️';
        sheet.appendChild(f0);
      }
      var body = document.createElement('div'); body.className='body';
      var name = document.createElement('div'); name.className='name'; name.textContent = it.name||'';
      body.appendChild(name);
      if(typeof it.price==='number' && it.price>0){
        var price = document.createElement('div'); price.className='price';
        price.textContent = '$' + it.price.toFixed(2);
        if(it.unit && it.unit!=='unidad'){
          var u = document.createElement('small'); u.textContent = ' / ' + it.unit;
          price.appendChild(u);
        }
        body.appendChild(price);
      } else {
        var ask = document.createElement('div'); ask.className='ask'; ask.textContent = T.consult;
        body.appendChild(ask);
      }
      // Canales de pedido: WhatsApp primero (mensaje pre-escrito), y los que el
      // dueño habilitó — SMS (con texto), Llamar, y sus redes como chips.
      var chs = cat.channels || {};
      if(waDigits){
        var a = document.createElement('a'); a.className='wa-btn'; a.target='_blank'; a.rel='noopener';
        a.textContent = '💬 ' + T.order + ' · WhatsApp';
        a.href = 'https://wa.me/' + waDigits + '?text=' + encodeURIComponent(T.msg + (it.name||''));
        body.appendChild(a);
      }
      if(waDigits && (chs.sms || chs.call)){
        var row = document.createElement('div');
        row.style.cssText = 'display:flex;gap:8px;margin-top:8px;';
        var alt = function(label, href){
          var b = document.createElement('a');
          b.style.cssText = 'flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px 8px;font-size:13px;font-weight:800;color:var(--ink);text-decoration:none;background:var(--panel);';
          b.textContent = label; b.href = href;
          return b;
        };
        if(chs.sms) row.appendChild(alt('✉️ ' + T.sms, 'sms:+' + waDigits + '?&body=' + encodeURIComponent(T.msg + (it.name||''))));
        if(chs.call) row.appendChild(alt('📞 ' + T.call, 'tel:+' + waDigits));
        body.appendChild(row);
      }
      var socials = [];
      if(chs.instagram) socials.push(['Instagram', 'https://instagram.com/' + encodeURIComponent(chs.instagram)]);
      if(chs.facebook) socials.push(['Facebook', 'https://facebook.com/' + encodeURIComponent(chs.facebook)]);
      if(chs.tiktok) socials.push(['TikTok', 'https://tiktok.com/@' + encodeURIComponent(chs.tiktok)]);
      if(socials.length){
        var srow = document.createElement('div');
        srow.style.cssText = 'display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center;';
        socials.forEach(function(s){
          var l = document.createElement('a');
          l.style.cssText = 'font-size:12px;font-weight:800;color:var(--ink-soft);text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:6px 12px;';
          l.textContent = s[0]; l.href = s[1]; l.target='_blank'; l.rel='noopener';
          srow.appendChild(l);
        });
        body.appendChild(srow);
      }
      sheet.appendChild(body);
      ov.appendChild(sheet);
      var closeIt = function(){ ov.remove(); };
      close.onclick = closeIt;
      ov.onclick = function(e){ if(e.target===ov) closeIt(); };
      document.body.appendChild(ov);
    }

    order.forEach(function(g){
      if(g && order.length>1){
        var h = document.createElement('div'); h.className='cat-header'; h.textContent=g;
        content.appendChild(h);
      }
      var grid = document.createElement('div'); grid.className='grid';
      groups[g].forEach(function(it){
        // Solo la foto, semi-cuadrada; sin foto, el nombre centrado hace de imagen.
        var card = document.createElement('button'); card.className='card'; card.type='button';
        card.setAttribute('aria-label', it.name||'');
        if(okPhoto(it.photoUrl)){
          var img = document.createElement('img'); img.loading='lazy'; img.alt=it.name||'';
          img.src = it.photoUrl;
          img.onerror = function(){ var n=document.createElement('div'); n.className='noph'; n.textContent=it.name||'🛍️'; img.replaceWith(n); };
          card.appendChild(img);
        } else {
          var n = document.createElement('div'); n.className='noph'; n.textContent = it.name||'🛍️';
          card.appendChild(n);
        }
        card.onclick = function(){ openDetail(it); };
        grid.appendChild(card);
      });
      content.appendChild(grid);
    });
  }

  if(!id){ statusEl.textContent = 'Catálogo no encontrado / Catalog not found'; return; }
  statusEl.textContent = 'Cargando… / Loading…';
  fetch('/.netlify/functions/get-catalog?c=' + encodeURIComponent(id))
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(run)
    .catch(function(){ statusEl.textContent = 'Catálogo no encontrado / Catalog not found'; });
})();
</script>
</body>
</html>
