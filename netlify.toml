# Antes de que existiera un package.json en la raíz del repo (agregado para Capacitor,
# ver Fase 3), Netlify instalaba solo las dependencias del package.json aparte que vive
# en netlify/functions/ (ahí vive firebase-admin, que usan las 3 funciones). En cuanto
# apareció el package.json de la raíz, Netlify dejó de hacerlo automático — este plugin
# restaura ese comportamiento sin tener que mezclar las dependencias de las functions
# con las del proyecto principal. Ver el mensaje de error de Netlify que sugiere esto
# mismo: "Dependencies installation error... firebase-admin has not been installed yet".
[[plugins]]
  package = "@netlify/plugin-functions-install-core"

# Link corto del catálogo público que cada negocio comparte con sus clientes:
# /c/<id> sirve catalogo.html con el id como query (rewrite 200, la URL bonita
# se mantiene en la barra del navegador).
[[redirects]]
  from = "/c/*"
  to = "/catalogo.html?c=:splat"
  status = 200

# ===== Caché =====
# Los archivos del shell (app-0*.js, dusty.css, patron-core.js) NO llevan hash en
# el nombre: la versión la maneja el service worker por CACHE_NAME. Por eso acá no
# se les pone caché larga — se quedarían viejos después de un deploy y ni el SW ni
# una recarga dura los podrían refrescar. Se dejan con la revalidación por defecto
# de Netlify.

# sw.js es el que decide TODO lo demás: si el navegador se lo queda cacheado, el
# usuario no recibe ninguna versión nueva de la app nunca más. Explícito a
# propósito, aunque coincida con el default: es la línea que no hay que romper.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# index.html referencia a todos los scripts por nombre fijo: si se cachea, el
# arranque sigue apuntando al juego viejo.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Íconos, imagen de compartir y fondos del editor de fotos: son los únicos
# realmente estáticos (cambian solo con un rediseño de marca, y ahí se renombran).
# Una semana ahorra volver a bajarlos en cada visita sin quedar atados si cambian.
[[headers]]
  for = "/backdrops/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
